{{- include "admission-controller.validateHostNetworkSidecar" . -}}
{{- $ctx := dict "root" $ "workload" "controller" "component" "controller" }}
{{- if and (or .Values.telemetry.metrics .Values.telemetry.tracing) (eq .Values.telemetry.mode "sidecar") }}
{{- $ctx = merge (dict "extraPodAnnotations" (dict "sidecar.opentelemetry.io/inject" "true")) $ctx }}
{{- end }}
{{- $w := .Values.controller | default dict }}
{{- $legacyImage := .Values.image | default dict }}
{{- $wImage := $w.image | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "admission-controller.fullname" . }}
  namespace: {{ include "admission-controller.namespace" . | quote }}
  {{- include "admission-controller.workloadLabels" $ctx | nindent 2 }}
  {{- with include "admission-controller.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  replicas: {{ include "admission-controller.replicas" $ctx }}
  selector:
    matchLabels:
      {{- include "admission-controller.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "admission-controller.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ else }}
      annotations:
      {{- end }}
      {{- include "admission-controller.podLabels" $ctx | nindent 6 }}
    spec:
      {{- with include "admission-controller.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      serviceAccountName: {{ include "admission-controller.serviceAccountName" . }}
      {{- with include "admission-controller.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      # The init container creates the certificate Secrets that are missing,
      # creates or updates the webhook configurations of the controller, and
      # waits until the kubelet copies the certificate of the webhook server
      # into the "cert" volume. The volume belongs to the pod, so the
      # controller container finds the certificate when it starts.
      initContainers:
      - name: init
        image: '{{ template "system_default_registry" $ctx }}{{ $legacyImage.repository | default $wImage.repository }}:{{ $legacyImage.tag | default $wImage.tag }}'
        imagePullPolicy: {{ include "admission-controller.imagePullPolicy" $ctx }}
        command:
        - /controller
        args:
        - --mode=init
        - --deployments-namespace={{ include "admission-controller.namespace" . }}
        - --webhook-service-name={{ include "admission-controller.webhookServiceName" . }}
        {{- with include "admission-controller.logLevel" $ctx }}
        - --zap-log-level={{ . }}
        {{- end }}
        {{- $initEnv := concat (include "admission-controller.extraEnv" $ctx | fromYamlArray) (.Values.additionalEnvironmentVariables | default list) }}
        {{- with $initEnv }}
        env:
        {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with include "admission-controller.extraEnvFrom" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "admission-controller.resources" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "admission-controller.containerSecurityContext" $ctx }}{{ . | nindent 8 }}{{ end }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        {{- with include "admission-controller.extraVolumeMounts" $ctx }}{{ . | nindent 8 }}{{ end }}
      containers:
      - name: controller
        args:
        - --leader-elect
        - --deployments-namespace={{ include "admission-controller.namespace" . }}
        - --webhook-service-name={{ include "admission-controller.webhookServiceName" . }}
        - --webhook-server-port={{ .Values.ports.webhook }}
        - --health-probe-bind-address=:{{ .Values.ports.healthProbe }}
        {{- if .Values.telemetry.metrics}}
        - --metrics-bind-address=:{{ .Values.ports.metrics }}
        {{- else }}
        # Port "0" disable the controller-runtime metrics port binding
        - --metrics-bind-address=0
        {{- end}}
        {{- if .Values.alwaysAcceptAdmissionReviewsOnDeploymentsNamespace }}
        - --always-accept-admission-reviews-on-deployments-namespace
        {{- end }}
        {{- with include "admission-controller.logLevel" $ctx }}
        - --zap-log-level={{ . }}
        {{- end }}
       {{- if .Values.mTLS.enable }}
        - --client-ca-configmap-name={{ .Values.mTLS.configMapName }}
       {{- end }}
       {{- $imagePullSecretNames := include "admission-controller.policyServerImagePullSecretNames" . }}
       {{- if $imagePullSecretNames }}
        - --image-pull-secrets={{ $imagePullSecretNames }}
       {{- end }}
       {{- if .Values.hostNetwork }}
        - --host-network
       {{- end }}
        - --defaults-configmap-name=kubewarden-defaults
        - --controller-configmap-name=kubewarden-controller-config
       {{- if or .Values.telemetry.metrics .Values.telemetry.tracing }}
       {{- if and (eq .Values.telemetry.mode "sidecar") }}
        - --enable-otel-sidecar
       {{- end }}
       {{- if .Values.telemetry.metrics }}
        - --enable-metrics
       {{- end }}
       {{- if .Values.telemetry.tracing }}
        - --enable-tracing
       {{- end }}
        {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorCertificateSecret }}
        - --opentelemetry-certificate-secret={{ .Values.telemetry.custom.otelCollectorCertificateSecret }}
        {{- end }}
        {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorClientCertificateSecret }}
        - --opentelemetry-client-certificate-secret={{ .Values.telemetry.custom.otelCollectorClientCertificateSecret }}
        {{- end }}
       {{- end }}
        command:
        - /controller
        env:
        {{- if and .Values.telemetry.metrics (eq .Values.telemetry.mode "sidecar") }}
          - name: KUBEWARDEN_POLICY_SERVER_SERVICES_METRICS_PORT
            value: "{{ .Values.telemetry.sidecar.metrics.port | default 8080 }}"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "https://localhost:4317"
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: "true"
        {{- end }}
        {{- if or .Values.telemetry.metrics .Values.telemetry.tracing }}
        {{- if eq .Values.telemetry.mode "custom" }}
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{.Values.telemetry.custom.endpoint}}
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: {{ .Values.telemetry.custom.insecure | default false | quote }}
        {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorCertificateSecret }}
          - name: OTEL_EXPORTER_OTLP_CERTIFICATE
            value: /kubewarden/otel-collector-certs/ca.crt 
        {{- end }}
        {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorClientCertificateSecret }}
          - name: OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE
            value: /kubewarden/otel-collector-client-certs/tls.crt
          - name: OTEL_EXPORTER_OTLP_CLIENT_KEY
            value: /kubewarden/otel-collector-client-certs/tls.key
        {{- end }}
        {{- end }}
        {{- end }}
          {{- with include "admission-controller.extraEnv" $ctx }}{{ . | nindent 10 }}{{ end }}
        {{- with .Values.additionalEnvironmentVariables }}
        {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with include "admission-controller.extraEnvFrom" $ctx }}{{ . | nindent 8 }}{{ end }}

        image: '{{ template "system_default_registry" $ctx }}{{ $legacyImage.repository | default $wImage.repository }}:{{ $legacyImage.tag | default $wImage.tag }}'
        imagePullPolicy: {{ include "admission-controller.imagePullPolicy" $ctx }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.ports.healthProbe }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.ports.healthProbe }}
          initialDelaySeconds: 5
          periodSeconds: 10
        {{- with include "admission-controller.resources" $ctx }}{{ . | nindent 8 }}{{ end }}
        {{- with include "admission-controller.containerSecurityContext" $ctx }}{{ . | nindent 8 }}{{ end }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        {{- if and (.Values.mTLS.enable) .Values.mTLS.configMapName }}
        - mountPath: /tmp/k8s-webhook-server/serving-certs/client-ca
          name: client-ca
          readOnly: true
        {{- end }}
        {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorCertificateSecret }}
        - mountPath: /kubewarden/otel-collector-certs
          name: otel-collector-certificate
          readOnly: true
        {{- end }}
        {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorClientCertificateSecret }}
        - mountPath: /kubewarden/otel-collector-client-certs
          name: otel-collector-client-certificate
          readOnly: true
        {{- end }}
        {{- with include "admission-controller.extraVolumeMounts" $ctx }}{{ . | nindent 8 }}{{ end }}
        ports:
        - containerPort: {{ .Values.ports.webhook }}
          name: webhook-server
          protocol: TCP
      volumes:
      # The init container creates the Secret on the first install, so the
      # volume must not block the start of the pod.
      - name: cert
        secret:
          defaultMode: 420
          secretName: kubewarden-webhook-server-cert
          optional: true
      {{- if and (.Values.mTLS.enable) .Values.mTLS.configMapName }}
      - name: client-ca
        configMap:
          name: {{ .Values.mTLS.configMapName }}
      {{- end }}
      {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorCertificateSecret }}
      - name: otel-collector-certificate
        secret:
          defaultMode: 420
          secretName: {{ .Values.telemetry.custom.otelCollectorCertificateSecret }}
          items:
            - key: ca.crt
              path: ca.crt
      {{- end }}
      {{- if and (not .Values.telemetry.custom.insecure) .Values.telemetry.custom.otelCollectorClientCertificateSecret }}
      - name: otel-collector-client-certificate
        secret:
          defaultMode: 420
          secretName: {{ .Values.telemetry.custom.otelCollectorClientCertificateSecret }}
          items:
            - key: tls.crt
              path: tls.crt
            - key: tls.key
              path: tls.key
      {{- end }}
      {{- with include "admission-controller.extraVolumes" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.podSecurityContext" $ctx }}{{ . | nindent 6 }}{{ end }}
      terminationGracePeriodSeconds: 10
