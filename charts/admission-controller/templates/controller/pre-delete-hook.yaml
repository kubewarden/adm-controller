{{- /*
The uninstall must leave behind ONLY the Kubewarden CRDs (kept via the
"helm.sh/resource-policy": keep annotation) and the user-defined
PolicyServer/policy CRs, so that a future re-installation of the chart can
adopt and reconcile them again. Everything that makes the policies run
(policy-server Deployments, Services, certificate Secrets, ConfigMaps,
PodDisruptionBudgets and the policies' webhook configurations) must be removed,
otherwise orphaned policy-servers would keep evaluating admission requests
without any controller reconciling them, or worse, webhook configurations would
still be around without policy-server Deployments, causing a DoS on the
cluster.

The Job runs the controller image in cleanup mode, which:
  1. Deletes the controller Deployment and waits for its pods to be gone, so
     nothing recreates the resources removed by the following steps.
  2. Deletes every Kubewarden webhook configuration, the ones of the policies
     and the ones of the controller, so no orphaned webhook keeps intercepting
     admission requests and the following writes to the Kubewarden custom
     resources are not rejected by webhooks pointing to the deleted controller.
  3. Strips the Kubewarden finalizers from the Kubewarden CRs, so they can be
     deleted with plain kubectl commands without a running controller honoring
     their finalizers.
  4. Deletes the custom resources managed by this chart (the default
     PolicyServer and the recommended policies). The user-defined custom
     resources are kept: the controller reconciles them again (and re-adds
     their finalizers) on re-installation.
  5. Deletes the resources backing the remaining PolicyServers. Only the
     resources labeled as policy-server components are swept: the chart-managed
     resources (e.g. the controller Services) are left for Helm to delete right
     after this hook.
  6. Deletes the certificate Secrets of the controller. They hold the CA, and
     a new installation must not reuse it. Helm does not delete them: the
     controller creates them, and the chart does not render them.
*/}}
{{- $ctx := dict "root" $ "workload" "preDeleteJob" "component" "pre-delete-job" }}
{{- $controllerCtx := dict "root" $ "workload" "controller" "component" "controller" }}
{{- $legacyImage := .Values.image | default dict }}
{{- $controllerImage := (.Values.controller | default dict).image | default dict }}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-delete" "helm.sh/hook-weight" "1" "helm.sh/hook-delete-policy" "hook-succeeded" }}
{{- $metadataCtx := merge (dict "extraAnnotations" $hookAnnotations) $ctx }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "admission-controller.preDeleteJobName" . }}
  namespace: {{ include "admission-controller.namespace" . | quote }}
  {{- include "admission-controller.workloadLabels" $ctx | nindent 2 }}
  {{- include "admission-controller.workloadAnnotations" $metadataCtx | nindent 2 }}
spec:
  template:
    metadata:
      name: {{ include "admission-controller.preDeleteJobName" . }}
      {{- include "admission-controller.podLabels" $ctx | nindent 6 }}
      {{- with include "admission-controller.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "admission-controller.serviceAccountName" . }}
      {{- with include "admission-controller.podSecurityContext" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.extraVolumes" $ctx }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: kubewarden-cleanup
          image: '{{ template "system_default_registry" $controllerCtx }}{{ $legacyImage.repository | default $controllerImage.repository }}:{{ $legacyImage.tag | default $controllerImage.tag }}'
          {{- with include "admission-controller.imagePullPolicy" $controllerCtx }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command:
            - /controller
          args:
            - --mode=cleanup
            - --deployments-namespace={{ include "admission-controller.namespace" . }}
            - --controller-deployment-name={{ include "admission-controller.fullname" . }}
            {{- with include "admission-controller.logLevel" $ctx }}
            - --zap-log-level={{ . }}
            {{- end }}
          {{- with concat (include "admission-controller.extraEnv" $ctx | fromYamlArray) (.Values.additionalEnvironmentVariables | default list) }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "admission-controller.extraEnvFrom" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.extraVolumeMounts" $ctx }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with include "admission-controller.containerSecurityContext" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.resources" $ctx }}{{ . | nindent 10 }}{{ end }}
