# In some scenarios when telemetry is enabled, due some concurrency issues,
# when the OTEL operator try to inject the collector container in the controller
# pod, it cannot find a valid collector configuration. Therefore, it is necessary
# to recreate the controller pod after the installation. This ensures that the
# controller pod will have the OTEL collector container.
# This restart hook is required only for sidecar telemetry mode to mitigate
# occasional OTel sidecar injection races during install/upgrade.
# In custom telemetry mode there is no sidecar injection, and forcing a restart
# can deadlock single-node hostNetwork rollouts due to hostPort conflicts.
{{ if and (or .Values.telemetry.metrics .Values.telemetry.tracing) (eq .Values.telemetry.mode "sidecar") }}
{{- $ctx := dict "root" $ "workload" "postInstallJob" "component" "post-install-job" }}
{{- $hookAnnotations := dict "helm.sh/hook" "post-install,post-upgrade" "helm.sh/hook-weight" "1" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
{{- $metadataCtx := merge (dict "extraAnnotations" $hookAnnotations) $ctx }}
{{- $legacyImage := (.Values.preDeleteJob | default dict).image | default dict }}
{{- $kubectlImage := (.Values.postInstallJob | default dict).image | default dict }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-delete-controller-job"
  namespace: {{ include "admission-controller.namespace" . | quote }}
  {{- include "admission-controller.workloadLabels" $ctx | nindent 2 }}
  {{- include "admission-controller.workloadAnnotations" $metadataCtx | nindent 2 }}
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}-delete-controller-job"
      {{- include "admission-controller.podLabels" $ctx | nindent 6 }}
      {{- with include "admission-controller.podAnnotations" $ctx }}{{ . | nindent 6 }}{{ end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "admission-controller.serviceAccountName" . }}
      {{- with include "admission-controller.podSecurityContext" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.imagePullSecrets" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.affinity" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.tolerations" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.nodeSelector" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.topologySpreadConstraints" $ctx }}{{ . | nindent 6 }}{{ end }}
      {{- with include "admission-controller.priorityClassName" $ctx }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: post-install-job
          image: '{{ template "system_default_registry" $ctx }}{{ $legacyImage.repository | default $kubectlImage.repository }}:{{ $legacyImage.tag | default $kubectlImage.tag }}'
          {{- with include "admission-controller.imagePullPolicy" $ctx }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command: ["kubectl", "--namespace", "{{ include "admission-controller.namespace" . }}", "rollout", "restart", "deployment", {{ include "admission-controller.fullname" . }}]
          env:
            - name: KUBERLR_ALLOWDOWNLOAD
              value: "1"
            # This image runs kubectl through kuberlr. kuberlr downloads a new
            # kubectl binary into a temporary file under /tmp, then moves the
            # file into $HOME/.kuberlr. The move needs both paths on the same
            # filesystem. Set HOME to /tmp, and mount one emptyDir at /tmp.
            # Do not split this into two separate mounts.
            - name: HOME
              value: /tmp
          {{- with include "admission-controller.containerSecurityContext" (merge (dict "fixedContainerSecurityContext" (dict "runAsUser" 1000 "runAsGroup" 1000)) $ctx) }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.resources" $ctx }}{{ . | nindent 10 }}{{ end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{ end }}
