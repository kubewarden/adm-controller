{{- if eq .Values.auditScanner.serviceAccountName "audit-scanner" }}
{{- $ctx := dict "root" $ "workload" "auditScanner" "component" "audit-scanner" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.auditScanner.serviceAccountName }}
  namespace: {{ include "admission-controller.namespace" . | quote }}
  labels:
    {{- include "admission-controller.labels" . | nindent 4 }}
  {{- with include "admission-controller.serviceAccountAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
{{- end }}
