{{- $ctx := dict "root" $ "workload" "auditScanner" "component" "audit-scanner" }}
{{- if include "admission-controller.enabled" $ctx }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "audit-scanner.fullname" . }}
  namespace: {{ include "admission-controller.namespace" . | quote }}
  {{- include "admission-controller.workloadLabels" $ctx | nindent 2 }}
  {{- with include "admission-controller.workloadAnnotations" $ctx }}{{ . | nindent 2 }}{{ end }}
spec:
  schedule: {{ .Values.auditScanner.cronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: {{ .Values.auditScanner.cronJob.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.auditScanner.cronJob.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          {{- include "admission-controller.podLabels" $ctx | nindent 10 }}
          {{- with include "admission-controller.podAnnotations" $ctx }}{{ . | nindent 10 }}{{ end }}
        spec:
          serviceAccountName: {{ .Values.auditScanner.serviceAccountName }}
          {{- with include "admission-controller.podSecurityContext" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.imagePullSecrets" $ctx }}{{ . | nindent 10 }}{{ end }}
          restartPolicy: {{ .Values.auditScanner.containerRestartPolicy }}
          volumes:
          - name: kubewarden-ca
            secret:
              defaultMode: 420
              secretName: kubewarden-ca
              items:
              - key: ca.crt
                path: "ca.crt"
          - name: kubewarden-audit-scanner-client-cert
            secret:
              defaultMode: 420
              secretName: kubewarden-audit-scanner-client-cert
              items:
              - key: tls.crt
                path: "tls.crt"
              - key: tls.key
                path: "tls.key"
          {{- with include "admission-controller.affinity" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.tolerations" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.nodeSelector" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.topologySpreadConstraints" $ctx }}{{ . | nindent 10 }}{{ end }}
          {{- with include "admission-controller.priorityClassName" $ctx }}{{ . | nindent 10 }}{{ end }}
          containers:
          - name: audit-scanner
            image: '{{ template "system_default_registry" $ctx }}{{ .Values.auditScanner.image.repository }}:{{ .Values.auditScanner.image.tag }}'
            imagePullPolicy: {{ include "admission-controller.imagePullPolicy" $ctx }}
            command:
              {{- include "audit-scanner.command" . | nindent 14 }}
            volumeMounts:
            - mountPath: "/pki"
              name: kubewarden-ca
              readOnly: true
            - mountPath: "/client-cert"
              name: kubewarden-audit-scanner-client-cert
              readOnly: true
            {{- with include "admission-controller.containerSecurityContext" $ctx }}{{ . | nindent 12 }}{{ end }}
            {{- with include "admission-controller.resources" $ctx }}{{ . | nindent 12 }}{{ end }}
{{ end }}
