{{- $ctx := dict "root" $ "workload" "auditScanner" "component" "audit-scanner" }}
{{- if .Values.auditScanner.enable }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "audit-scanner.fullname" . }}
  namespace: {{ include "admission-controller.namespace" . | quote }}
  labels:
    {{- include "admission-controller.labels" . | nindent 4 }}
  annotations:
    {{- include "admission-controller.annotations" . | nindent 4 }}
spec:
  schedule: {{ .Values.auditScanner.cronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: {{ .Values.auditScanner.cronJob.failedJobsHistoryLimit }}
  successfulJobsHistoryLimit: {{ .Values.auditScanner.cronJob.successfulJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ .Values.auditScanner.serviceAccountName }}
          {{- with .Values.podSecurityContext }}
          securityContext:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "admission-controller.imagePullSecrets" $ctx }}{{ . | nindent 10 }}{{ end }}
          restartPolicy: {{ .Values.auditScanner.containerRestartPolicy }}
          volumes:
          - name: kubewarden-ca
            secret:
              defaultMode: 420
              secretName: kubewarden-ca
              items:
              - key: ca.crt
                path: "ca.crt"
          - name: kubewarden-audit-scanner-client-cert
            secret:
              defaultMode: 420
              secretName: kubewarden-audit-scanner-client-cert
              items:
              - key: tls.crt
                path: "tls.crt"
              - key: tls.key
                path: "tls.key"
          {{- if .Values.global.affinity }}
          affinity: {{ .Values.global.affinity | toYaml | nindent 14 }}
          {{- end }}
          {{- if .Values.global.tolerations }}
          tolerations: {{ .Values.global.tolerations | toYaml | nindent 14 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 14 }}
          {{- end }}
          containers:
          - name: audit-scanner
            image: '{{ template "system_default_registry" $ctx }}{{ .Values.auditScanner.image.repository }}:{{ .Values.auditScanner.image.tag }}'
            imagePullPolicy: {{ include "admission-controller.imagePullPolicy" $ctx }}
            command:
              {{- include "audit-scanner.command" . | nindent 14 }}
            volumeMounts:
            - mountPath: "/pki"
              name: kubewarden-ca
              readOnly: true
            - mountPath: "/client-cert"
              name: kubewarden-audit-scanner-client-cert
              readOnly: true
            {{- if .Values.containerSecurityContext }}
            securityContext:
{{ toYaml .Values.containerSecurityContext | indent 14 }}
            {{- end }}
            {{- with include "admission-controller.resources" $ctx }}{{ . | nindent 12 }}{{ end }}
{{ end }}
