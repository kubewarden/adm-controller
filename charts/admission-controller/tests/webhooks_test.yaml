suite: certificates generation
templates:
  - controller/webhooks.yaml
release:
  namespace: "kubewarden"
tests:
  - it: "should generate a CA certificate and store it in the kubewarden-ca secret"
    documentSelector:
      path: metadata.name
      value: kubewarden-ca
    asserts:
      - isNotNullOrEmpty:
          path: data["ca.crt"]
      - isNotNullOrEmpty:
          path: data["ca.key"]
      - notExists:
          path: data["old-ca.crt"]
  - it: "should generate a leaf certificate and store it in the kubewarden-webhook-server-cert secret"
    documentSelector:
      path: metadata.name
      value: kubewarden-webhook-server-cert
    asserts:
      - isNotNullOrEmpty:
          path: data["tls.crt"]
      - isNotNullOrEmpty:
          path: data["tls.key"]
  - it: "should generate a leaf certificate and store it in the kubewarden-audit-scanner-client-cert secret"
    documentSelector:
      path: metadata.name
      value: kubewarden-audit-scanner-client-cert
    asserts:
      - isNotNullOrEmpty:
          path: data["tls.crt"]
      - isNotNullOrEmpty:
          path: data["tls.key"]
  - it: "should inject the caBundle into the webhook configurations"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    asserts:
      - isNotNullOrEmpty:
          path: webhooks[*].clientConfig.caBundle
  - it: "should not set the CA bundle injection annotation on the webhook configurations"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    asserts:
      - notExists:
          path: metadata.annotations["kubewarden.io/inject-ca-from"]
  - it: "should set the Kubewarden label that the cert controller selects on the webhook configurations"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kubewarden
  - it: "should set additionalAnnotations on the webhook configurations"
    documentSelector:
      path: apiVersion
      value: admissionregistration.k8s.io/v1
      matchMany: true
    set:
      additionalAnnotations:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations.team
          value: platform
