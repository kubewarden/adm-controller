suite: post-install hook rendering
templates:
  - controller/post-install-hook.yaml
tests:
  - it: "should render post-install hook for sidecar telemetry"
    set:
      telemetry:
        mode: sidecar
        metrics: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: kubectl
      - equal:
          path: spec.template.spec.containers[0].command[4]
          value: restart
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HOME
            value: /tmp
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: "should not render post-install hook for custom telemetry"
    set:
      telemetry:
        mode: custom
        metrics: true
        tracing: true
        custom:
          endpoint: "http://my-collector-collector.kubewarden.svc:4317"
          insecure: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "should not render post-install hook when telemetry is disabled"
    set:
      telemetry:
        mode: sidecar
        metrics: false
        tracing: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "should schedule the Job with the global tolerations and the node selector"
    set:
      telemetry:
        mode: sidecar
        metrics: true
      global:
        tolerations:
          - key: dedicated
            operator: Equal
            value: kubewarden
            effect: NoSchedule
      nodeSelector:
        disktype: ssd
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Equal
              value: kubewarden
              effect: NoSchedule
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            disktype: ssd
