suite: "Values contract: global"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/controller/audit-scanner.yaml"
  - "templates/controller/pre-delete-hook.yaml"
  - "templates/controller/pre-upgrade-hook.yaml"
  - "templates/controller/post-install-hook.yaml"
  - "templates/defaults/defaults-configmap.yaml"
  - "templates/controller/controller-serviceaccount.yaml"
  - "templates/controller/audit-scanner-serviceaccount.yaml"
  - "templates/defaults/policy-server-rbac.yaml"
# The post-install Job renders only with the deprecated telemetry sidecar mode.
set:
  telemetry:
    metrics: true
tests:
  - it: "should render global.imagePullPolicy on every workload"
    set:
      global:
        imagePullPolicy: Always
    asserts:
      - equal: {path: "spec.template.spec.containers[0].imagePullPolicy", value: Always}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.template.spec.initContainers[0].imagePullPolicy", value: Always}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy", value: Always}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.template.spec.containers[0].imagePullPolicy", value: Always}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.spec.containers[0].imagePullPolicy", value: Always}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.containers[0].imagePullPolicy", value: Always}
        template: "templates/controller/post-install-hook.yaml"

  - it: "should render global.logLevel on every workload"
    set:
      global:
        logLevel: debug
    asserts:
      - contains: {path: "spec.template.spec.containers[0].args", content: "--zap-log-level=debug"}
        template: "templates/controller/deployment.yaml"
      - contains: {path: "spec.template.spec.initContainers[0].args", content: "--zap-log-level=debug"}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].command[3]", value: "--loglevel"}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].command[4]", value: debug}
        template: "templates/controller/audit-scanner.yaml"
      - contains: {path: "spec.template.spec.containers[0].args", content: "--zap-log-level=debug"}
        template: "templates/controller/pre-delete-hook.yaml"
      - contains: {path: "spec.template.spec.containers[0].args", content: "--zap-log-level=debug"}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - matchRegex:
          path: data["policyserver-default.yaml"]
          pattern: '  env:\n    - name: "KUBEWARDEN_LOG_LEVEL"\n      value: "debug"\n'
        template: "templates/defaults/defaults-configmap.yaml"

  # The controller gives the image pull secrets to every PolicyServer with the
  # --image-pull-secrets flag.
  - it: "should render global.imagePullSecrets on every workload"
    set:
      global:
        imagePullSecrets:
          - name: registry-credentials
    asserts:
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/post-install-hook.yaml"
      - contains: {path: "spec.template.spec.containers[0].args", content: "--image-pull-secrets=registry-credentials"}
        template: "templates/controller/deployment.yaml"

  - it: "should accept plain Secret names in global.imagePullSecrets"
    set:
      global:
        imagePullSecrets:
          - registry-credentials
    asserts:
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: registry-credentials}]}
        template: "templates/controller/post-install-hook.yaml"
      - contains: {path: "spec.template.spec.containers[0].args", content: "--image-pull-secrets=registry-credentials"}
        template: "templates/controller/deployment.yaml"

  - it: "should skip empty names in imagePullSecrets"
    set:
      global:
        imagePullSecrets:
          - ""
          - {}
          - name: ""
          - other: x
          - name: real-secret
    asserts:
      - equal: {path: "spec.template.spec.imagePullSecrets", value: [{name: real-secret}]}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.imagePullSecrets", value: [{name: real-secret}]}
        template: "templates/controller/audit-scanner.yaml"
      - contains: {path: "spec.template.spec.containers[0].args", content: "--image-pull-secrets=real-secret"}
        template: "templates/controller/deployment.yaml"

  - it: "should omit imagePullSecrets when all names are empty"
    set:
      global:
        imagePullSecrets:
          - ""
          - {}
          - name: ""
    asserts:
      - notExists: {path: "spec.template.spec.imagePullSecrets"}
        template: "templates/controller/deployment.yaml"
      - notExists: {path: "spec.jobTemplate.spec.template.spec.imagePullSecrets"}
        template: "templates/controller/audit-scanner.yaml"
      - notExists: {path: "spec.template.spec.imagePullSecrets"}
        template: "templates/controller/pre-delete-hook.yaml"
      - notExists: {path: "spec.template.spec.imagePullSecrets"}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - notExists: {path: "spec.template.spec.imagePullSecrets"}
        template: "templates/controller/post-install-hook.yaml"
      - notContains: {path: "spec.template.spec.containers[0].args", content: "--image-pull-secrets="}
        template: "templates/controller/deployment.yaml"

  - it: "should render global.labels on every workload"
    set:
      global:
        labels:
          team: security
    asserts:
      - equal: {path: "metadata.labels.team", value: security}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "metadata.labels.team", value: security}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "metadata.labels.team", value: security}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "metadata.labels.team", value: security}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "metadata.labels.team", value: security}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^    team: security$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - notExists: {path: "spec.template.metadata.labels.team"}
        template: "templates/controller/deployment.yaml"

  - it: "should render global.annotations on every workload"
    set:
      global:
        annotations:
          example.com/owner: security
    asserts:
      - equal: {path: 'metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/deployment.yaml"
      - equal: {path: 'metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: 'metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: 'metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: 'metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  annotations:\n    example\.com/owner: security$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - notExists: {path: 'spec.template.metadata.annotations["example.com/owner"]'}
        template: "templates/controller/deployment.yaml"

  - it: "should render global.podLabels on every workload"
    set:
      global:
        podLabels:
          team: security
    asserts:
      - equal: {path: "spec.template.metadata.labels.team", value: security}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.metadata.labels.team", value: security}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.template.metadata.labels.team", value: security}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.metadata.labels.team", value: security}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.metadata.labels.team", value: security}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  labels:\n    "team": "security"$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - notExists: {path: "metadata.labels.team"}
        template: "templates/controller/deployment.yaml"

  - it: "should render global.podAnnotations on every workload"
    set:
      global:
        podAnnotations:
          example.com/owner: security
    asserts:
      - equal: {path: 'spec.template.metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/deployment.yaml"
      - equal: {path: 'spec.jobTemplate.spec.template.metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: 'spec.template.metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: 'spec.template.metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: 'spec.template.metadata.annotations["example.com/owner"]', value: security}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  annotations:\n    "example\.com/owner": "security"$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - notExists: {path: 'metadata.annotations["example.com/owner"]'}
        template: "templates/controller/deployment.yaml"

  - it: "should render global.imageRegistry on every workload and on the recommended policies"
    set:
      global:
        imageRegistry: registry.example.com
      recommendedPolicies:
        enabled: true
    asserts:
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^registry\.example\.com/kubewarden/adm-controller/controller:'}
        template: "templates/controller/deployment.yaml"
      - matchRegex: {path: "spec.template.spec.initContainers[0].image", pattern: '^registry\.example\.com/kubewarden/adm-controller/controller:'}
        template: "templates/controller/deployment.yaml"
      - matchRegex: {path: "spec.jobTemplate.spec.template.spec.containers[0].image", pattern: '^registry\.example\.com/kubewarden/adm-controller/audit-scanner:'}
        template: "templates/controller/audit-scanner.yaml"
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^registry\.example\.com/kubewarden/adm-controller/controller:'}
        template: "templates/controller/pre-delete-hook.yaml"
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^registry\.example\.com/kubewarden/adm-controller/controller:'}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^registry\.example\.com/rancher/kuberlr-kubectl:'}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  image: registry\.example\.com/kubewarden/adm-controller/policy-server:'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["allow-privilege-escalation.yaml"]', pattern: '(?m)^  module: registry\.example\.com/kubewarden/policies/'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["capabilities.yaml"]', pattern: '(?m)^  module: registry\.example\.com/kubewarden/policies/'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["host-namespace.yaml"]', pattern: '(?m)^  module: registry\.example\.com/kubewarden/policies/'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["host-paths.yaml"]', pattern: '(?m)^  module: registry\.example\.com/kubewarden/policies/'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["pod-privileged.yaml"]', pattern: '(?m)^  module: registry\.example\.com/kubewarden/policies/'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["user-group.yaml"]', pattern: '(?m)^  module: registry\.example\.com/kubewarden/policies/'}
        template: "templates/defaults/defaults-configmap.yaml"
