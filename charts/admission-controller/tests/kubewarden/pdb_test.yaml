suite: "Values contract: PodDisruptionBudgets"
templates:
  - "templates/controller/poddisruptionbudget.yaml"
  - "templates/controller/deployment.yaml"
  - "templates/defaults/defaults-configmap.yaml"
release:
  name: rel
  namespace: kw
tests:
  - it: "should not render a PodDisruptionBudget by default"
    asserts:
      - hasDocuments: {count: 0}
        template: "templates/controller/poddisruptionbudget.yaml"
      - notMatchRegex: {path: 'data["policyserver-default.yaml"]', pattern: "minAvailable|maxUnavailable"}
        template: "templates/defaults/defaults-configmap.yaml"

  - it: "should render the controller PodDisruptionBudget with minAvailable"
    set:
      controller:
        podDisruptionBudget:
          minAvailable: 1
    asserts:
      - isKind: {of: PodDisruptionBudget}
        template: "templates/controller/poddisruptionbudget.yaml"
      - equal: {path: "metadata.name", value: rel-admission-controller}
        template: "templates/controller/poddisruptionbudget.yaml"
      - equal: {path: "metadata.namespace", value: kw}
        template: "templates/controller/poddisruptionbudget.yaml"
      - equal: {path: "spec.minAvailable", value: 1}
        template: "templates/controller/poddisruptionbudget.yaml"
      - notExists: {path: "spec.maxUnavailable"}
        template: "templates/controller/poddisruptionbudget.yaml"
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller
        template: "templates/controller/poddisruptionbudget.yaml"
      # The selector matches the controller pods.
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller
        template: "templates/controller/deployment.yaml"
      - equal: {path: 'spec.template.metadata.labels["app.kubernetes.io/component"]', value: controller}
        template: "templates/controller/deployment.yaml"
      # The controller PodDisruptionBudget does not reach the PolicyServer.
      - notMatchRegex: {path: 'data["policyserver-default.yaml"]', pattern: "minAvailable|maxUnavailable"}
        template: "templates/defaults/defaults-configmap.yaml"

  - it: "should render the controller PodDisruptionBudget with maxUnavailable"
    set:
      controller:
        podDisruptionBudget:
          maxUnavailable: "50%"
    asserts:
      - equal: {path: "spec.maxUnavailable", value: "50%"}
        template: "templates/controller/poddisruptionbudget.yaml"
      - notExists: {path: "spec.minAvailable"}
        template: "templates/controller/poddisruptionbudget.yaml"

  - it: "should render a zero minAvailable"
    set:
      controller:
        podDisruptionBudget:
          minAvailable: 0
    asserts:
      - equal: {path: "spec.minAvailable", value: 0}
        template: "templates/controller/poddisruptionbudget.yaml"

  - it: "should not change the controller selector when the labels change"
    set:
      controller:
        podDisruptionBudget:
          minAvailable: 1
      global:
        podLabels:
          app.kubernetes.io/component: other
          app.kubernetes.io/instance: other
      additionalLabels:
        team: security
    asserts:
      - equal:
          path: "spec.selector.matchLabels"
          value:
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: controller
        template: "templates/controller/poddisruptionbudget.yaml"

  - it: "should render policyServer.podDisruptionBudget on the default PolicyServer only"
    set:
      policyServer:
        podDisruptionBudget:
          minAvailable: 30%
    asserts:
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  minAvailable: 30%$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - notMatchRegex: {path: 'data["policyserver-default.yaml"]', pattern: "maxUnavailable"}
        template: "templates/defaults/defaults-configmap.yaml"
      - hasDocuments: {count: 0}
        template: "templates/controller/poddisruptionbudget.yaml"

  - it: "should render policyServer.podDisruptionBudget.maxUnavailable"
    set:
      policyServer:
        podDisruptionBudget:
          maxUnavailable: 1
    asserts:
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  maxUnavailable: 1$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - notMatchRegex: {path: 'data["policyserver-default.yaml"]', pattern: "minAvailable"}
        template: "templates/defaults/defaults-configmap.yaml"
