suite: "Values contract: ServiceAccounts"
templates:
  - "templates/controller/controller-serviceaccount.yaml"
  - "templates/controller/audit-scanner-serviceaccount.yaml"
  - "templates/defaults/policy-server-rbac.yaml"
  - "templates/controller/deployment.yaml"
  - "templates/controller/audit-scanner.yaml"
  - "templates/controller/pre-delete-hook.yaml"
  - "templates/controller/pre-upgrade-hook.yaml"
  - "templates/controller/post-install-hook.yaml"
release:
  name: rel
tests:
  - it: "should render no ServiceAccount annotations by default"
    asserts:
      - notExists: {path: "metadata.annotations"}
        template: "templates/controller/controller-serviceaccount.yaml"
      - notExists: {path: "metadata.annotations"}
        template: "templates/controller/audit-scanner-serviceaccount.yaml"
      # The pre-upgrade ServiceAccount always has the Helm hook annotations.
      - equal: {path: "metadata.annotations", value: {helm.sh/hook: pre-upgrade, helm.sh/hook-weight: "-1", helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"}}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: ServiceAccount}
      - isKind: {of: ServiceAccount}
        template: "templates/defaults/policy-server-rbac.yaml"
        documentIndex: 0
      - notExists: {path: "metadata.annotations"}
        template: "templates/defaults/policy-server-rbac.yaml"
        documentIndex: 0

  - it: "should render global.serviceAccount.annotations on every ServiceAccount"
    set:
      global:
        serviceAccount:
          annotations:
            example.com/role: kubewarden
    asserts:
      - equal: {path: 'metadata.annotations["example.com/role"]', value: kubewarden}
        template: "templates/controller/controller-serviceaccount.yaml"
      - equal: {path: 'metadata.annotations["example.com/role"]', value: kubewarden}
        template: "templates/controller/audit-scanner-serviceaccount.yaml"
      - equal: {path: 'metadata.annotations["example.com/role"]', value: kubewarden}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: ServiceAccount}
      - equal: {path: 'metadata.annotations["example.com/role"]', value: kubewarden}
        template: "templates/defaults/policy-server-rbac.yaml"
        documentIndex: 0

  - it: "should render the serviceAccount.annotations of each workload block on its own ServiceAccount"
    set:
      controller:
        serviceAccount:
          annotations: {example.com/role: controller}
      auditScanner:
        serviceAccount:
          annotations: {example.com/role: audit-scanner}
      preDeleteJob:
        serviceAccount:
          annotations: {example.com/role: pre-delete-job}
      policyServer:
        serviceAccount:
          annotations: {example.com/role: policy-server}
    asserts:
      - equal: {path: "metadata.annotations", value: {example.com/role: controller}}
        template: "templates/controller/controller-serviceaccount.yaml"
      - equal: {path: "metadata.annotations", value: {example.com/role: audit-scanner}}
        template: "templates/controller/audit-scanner-serviceaccount.yaml"
      # The pre-upgrade ServiceAccount uses the values of the preDeleteJob block.
      - equal: {path: 'metadata.annotations["example.com/role"]', value: pre-delete-job}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: ServiceAccount}
      - equal: {path: "metadata.annotations", value: {example.com/role: policy-server}}
        template: "templates/defaults/policy-server-rbac.yaml"
        documentIndex: 0

  - it: "should merge serviceAccount.annotations: global, common, workload, then additionalAnnotations"
    set:
      global:
        serviceAccount:
          annotations: {a: "1", b: "1", c: "1", d: "1"}
      common:
        serviceAccount:
          annotations: {b: "2", c: "2"}
      controller:
        serviceAccount:
          annotations: {c: "3"}
      preDeleteJob:
        serviceAccount:
          annotations: {c: "4"}
      additionalAnnotations:
        d: additional
    asserts:
      - equal: {path: "metadata.annotations", value: {a: "1", b: "2", c: "3", d: additional}}
        template: "templates/controller/controller-serviceaccount.yaml"
      - equal: {path: "metadata.annotations", value: {a: "1", b: "2", c: "2", d: additional}}
        template: "templates/controller/audit-scanner-serviceaccount.yaml"
      - equal: {path: "metadata.annotations", value: {a: "1", b: "2", c: "4", d: additional, helm.sh/hook: pre-upgrade, helm.sh/hook-weight: "-1", helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"}}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: ServiceAccount}

  # The pre-delete and post-install Jobs have no ServiceAccount of their own.
  # They run with the controller ServiceAccount.
  # The pre-upgrade Job has its own ServiceAccount.
  - it: "should run the controller, the pre-delete Job and the post-install Job with the controller ServiceAccount, and the pre-upgrade Job with its own ServiceAccount"
    set:
      telemetry:
        metrics: true
    asserts:
      - equal: {path: "metadata.name", value: rel-admission-controller}
        template: "templates/controller/controller-serviceaccount.yaml"
      - equal: {path: "spec.template.spec.serviceAccountName", value: rel-admission-controller}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.template.spec.serviceAccountName", value: rel-admission-controller}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "metadata.name", value: rel-admission-controller-pre-upgrade}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: ServiceAccount}
      - equal: {path: "spec.template.spec.serviceAccountName", value: rel-admission-controller-pre-upgrade}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.serviceAccountName", value: rel-admission-controller}
        template: "templates/controller/post-install-hook.yaml"
      - equal: {path: "metadata.name", value: audit-scanner}
        template: "templates/controller/audit-scanner-serviceaccount.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.serviceAccountName", value: audit-scanner}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "metadata.name", value: policy-server}
        template: "templates/defaults/policy-server-rbac.yaml"
        documentIndex: 0

  - it: "should not render the audit scanner ServiceAccount when auditScanner.serviceAccountName is custom"
    set:
      auditScanner:
        serviceAccountName: my-scanner
        serviceAccount:
          annotations: {example.com/role: audit-scanner}
    asserts:
      - hasDocuments: {count: 0}
        template: "templates/controller/audit-scanner-serviceaccount.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.serviceAccountName", value: my-scanner}
        template: "templates/controller/audit-scanner.yaml"
