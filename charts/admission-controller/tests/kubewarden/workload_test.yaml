suite: "Values contract: workload-only keys"
templates:
  - "templates/controller/deployment.yaml"
  - "templates/controller/audit-scanner.yaml"
  - "templates/controller/pre-delete-hook.yaml"
  - "templates/controller/pre-upgrade-hook.yaml"
  - "templates/controller/post-install-hook.yaml"
  - "templates/defaults/defaults-configmap.yaml"
# The post-install Job renders only with the deprecated telemetry sidecar mode.
set:
  telemetry:
    metrics: true
tests:
  - it: "should use ghcr.io when the workload image has no registry key"
    # helm upgrade --reuse-values from a chart version without image.registry
    # gives images without a registry key.
    set:
      controller:
        image:
          registry: null
      auditScanner:
        image:
          registry: null
      policyServer:
        image:
          registry: null
      postInstallJob:
        image:
          registry: null
    asserts:
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^ghcr\.io/kubewarden/adm-controller/controller:'}
        template: "templates/controller/deployment.yaml"
      - matchRegex: {path: "spec.template.spec.initContainers[0].image", pattern: '^ghcr\.io/kubewarden/adm-controller/controller:'}
        template: "templates/controller/deployment.yaml"
      - matchRegex: {path: "spec.jobTemplate.spec.template.spec.containers[0].image", pattern: '^ghcr\.io/kubewarden/adm-controller/audit-scanner:'}
        template: "templates/controller/audit-scanner.yaml"
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^ghcr\.io/kubewarden/adm-controller/controller:'}
        template: "templates/controller/pre-delete-hook.yaml"
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^ghcr\.io/kubewarden/adm-controller/controller:'}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^ghcr\.io/rancher/kuberlr-kubectl:'}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  image: ghcr\.io/kubewarden/adm-controller/policy-server:'}
        template: "templates/defaults/defaults-configmap.yaml"

  - it: "should use no registry prefix when the workload image registry is empty"
    set:
      controller:
        image:
          registry: ""
    asserts:
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^kubewarden/adm-controller/controller:'}
        template: "templates/controller/deployment.yaml"
      - matchRegex: {path: "spec.template.spec.containers[0].image", pattern: '^kubewarden/adm-controller/controller:'}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}

  - it: "should render the resources and security contexts of each workload block on its own workload"
    set:
      controller:
        resources: {limits: {cpu: "1"}}
        podSecurityContext: {fsGroup: 1001}
        containerSecurityContext: {runAsUser: 1001}
      auditScanner:
        resources: {limits: {cpu: "2"}}
        podSecurityContext: {fsGroup: 1002}
        containerSecurityContext: {runAsUser: 1002}
      preDeleteJob:
        resources: {limits: {cpu: "3"}}
        podSecurityContext: {fsGroup: 1003}
        containerSecurityContext: {runAsUser: 1003}
      postInstallJob:
        resources: {limits: {cpu: "4"}}
        podSecurityContext: {fsGroup: 1004}
        containerSecurityContext: {runAsUser: 1004, readOnlyRootFilesystem: false}
      policyServer:
        resources: {limits: {cpu: "5"}}
        podSecurityContext: {fsGroup: 1005}
        containerSecurityContext: {runAsUser: 1005}
    asserts:
      - equal: {path: "spec.template.spec.containers[0].resources.limits.cpu", value: "1"}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.template.spec.securityContext.fsGroup", value: 1001}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.template.spec.containers[0].securityContext.runAsUser", value: 1001}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.template.spec.initContainers[0].resources.limits.cpu", value: "1"}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.template.spec.initContainers[0].securityContext.runAsUser", value: 1001}
        template: "templates/controller/deployment.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].resources.limits.cpu", value: "2"}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.securityContext.fsGroup", value: 1002}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.jobTemplate.spec.template.spec.containers[0].securityContext.runAsUser", value: 1002}
        template: "templates/controller/audit-scanner.yaml"
      - equal: {path: "spec.template.spec.containers[0].resources.limits.cpu", value: "3"}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.spec.securityContext.fsGroup", value: 1003}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.spec.containers[0].securityContext.runAsUser", value: 1003}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.spec.containers[0].resources.limits.cpu", value: "3"}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.securityContext.fsGroup", value: 1003}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.containers[0].securityContext.runAsUser", value: 1003}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.spec.containers[0].resources.limits.cpu", value: "4"}
        template: "templates/controller/post-install-hook.yaml"
      - equal: {path: "spec.template.spec.securityContext.fsGroup", value: 1004}
        template: "templates/controller/post-install-hook.yaml"
      - equal: {path: "spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem", value: false}
        template: "templates/controller/post-install-hook.yaml"
      # The chart always sets runAsUser and runAsGroup 1000 on the post-install Job container.
      # A user value cannot replace them.
      - equal: {path: "spec.template.spec.containers[0].securityContext.runAsUser", value: 1000}
        template: "templates/controller/post-install-hook.yaml"
      - equal: {path: "spec.template.spec.containers[0].securityContext.runAsGroup", value: 1000}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  limits: \n    cpu: "5"$'}
        template: "templates/defaults/defaults-configmap.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  securityContexts: \n    container:\n      runAsUser: 1005\n    pod:\n      fsGroup: 1005$'}
        template: "templates/defaults/defaults-configmap.yaml"

  - it: "should render the replicas of each workload block on its own workload"
    set:
      controller:
        replicas: 3
      policyServer:
        replicas: 4
    asserts:
      - equal: {path: "spec.replicas", value: 3}
        template: "templates/controller/deployment.yaml"
      - matchRegex: {path: 'data["policyserver-default.yaml"]', pattern: '(?m)^  replicas: 4$'}
        template: "templates/defaults/defaults-configmap.yaml"

  - it: "should name the hook Jobs after the chart fullname"
    release:
      name: rel
    asserts:
      - equal: {path: "metadata.name", value: rel-admission-controller-pre-delete}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "spec.template.metadata.name", value: rel-admission-controller-pre-delete}
        template: "templates/controller/pre-delete-hook.yaml"
      - contains: {path: "spec.template.spec.containers[0].args", content: "--controller-deployment-name=rel-admission-controller"}
        template: "templates/controller/pre-delete-hook.yaml"
      - equal: {path: "metadata.name", value: rel-admission-controller-pre-upgrade}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "spec.template.metadata.name", value: rel-admission-controller-pre-upgrade}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - equal: {path: "metadata.name", value: rel-admission-controller-post-install}
        template: "templates/controller/post-install-hook.yaml"
      - equal: {path: "spec.template.spec.containers[0].command[6]", value: rel-admission-controller}
        template: "templates/controller/post-install-hook.yaml"

  - it: "should keep the hook Job names at 63 characters or less with a 63-character fullnameOverride"
    set:
      fullnameOverride: "a23456789-123456789-123456789-123456789-123456789-123456789-123"
    asserts:
      - matchRegex: {path: "metadata.name", pattern: '^a23456789-123456789-123456789-123456789-123456789-12-pre-delete$'}
        template: "templates/controller/pre-delete-hook.yaml"
      - matchRegex: {path: "metadata.name", pattern: '^.{1,63}$'}
        template: "templates/controller/pre-delete-hook.yaml"
      - matchRegex: {path: "metadata.name", pattern: '^a23456789-123456789-123456789-123456789-123456789-1-pre-upgrade$'}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - matchRegex: {path: "metadata.name", pattern: '^.{1,63}$'}
        template: "templates/controller/pre-upgrade-hook.yaml"
        documentSelector: {path: kind, value: Job}
      - matchRegex: {path: "metadata.name", pattern: '^a23456789-123456789-123456789-123456789-123456789-post-install$'}
        template: "templates/controller/post-install-hook.yaml"
      - matchRegex: {path: "metadata.name", pattern: '^.{1,63}$'}
        template: "templates/controller/post-install-hook.yaml"

  - it: "should keep the hook Job names valid when the cut fullname ends with a dash"
    set:
      fullnameOverride: "a23456789-123456789-123456789-123456789-123456789-1-3456789-123"
    asserts:
      - matchRegex: {path: "metadata.name", pattern: '^a23456789-123456789-123456789-123456789-123456789-1-pre-delete$'}
        template: "templates/controller/pre-delete-hook.yaml"
      - matchRegex: {path: "metadata.name", pattern: '^a23456789-123456789-123456789-123456789-123456789-post-install$'}
        template: "templates/controller/post-install-hook.yaml"
