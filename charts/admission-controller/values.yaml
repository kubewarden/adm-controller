# Settings for kubewarden-controller.
# nameOverride Replaces the release name of the chart in Chart.yaml file when
# this is used to construct Kubernetes object names
nameOverride: ""
# fullnameOverride completely replaces the generated release name
fullnameOverride: ""
# Secrets to pull container images from private registries
imagePullSecrets: []
# -- Additional labels to add to all resources
additionalLabels: {}
#   app: kubewarden-controller
# -- Additional annotations to add to all resources
additionalAnnotations: {}
#   owner: IT-group1
# SecurityContext to be used in the controller and audit-scanner containers. The
# content of the containerSecurityContext will be set directly as the
# securityContext of the container
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
# SecurityContext to be used in the controller and audit-scanner pods. The
# content of the podSecurityContext will be set directly as the securityContext
# of the pod
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# SecurityContext to be used in the pre-delete-hook job container and pod.
# The content of the next fields will be set directly as the securityContext
# of the container and pod used in the pre-delete-hook job.
preDeleteHook:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
# If true, the controller will always accept admission reviews in the
# deployment namespace. It is recommended to keep this value true unless you
# have a specific reason to disable it. This is a safety flag to avoid policy
# evaluations that could interfere with the Kubewarden stack running in the
# admission controller namespace.
alwaysAcceptAdmissionReviewsOnDeploymentsNamespace: true
# affinity configures affinity rules for the controller pod.
# This takes precedence over global.affinity when set.
# When hostNetwork is enabled, users should set appropriate podAntiAffinity
# rules here to prevent host-port conflicts between controller replicas.
# affinity:
#   podAntiAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#     - labelSelector:
#         matchLabels:
#           app.kubernetes.io/name: kubewarden-controller
#       topologyKey: kubernetes.io/hostname
affinity: {}
# hostNetwork enables host network mode for the controller pod and all
# PolicyServer pods managed by this controller.
# WARNING: enabling this increases the attack surface by exposing webhook
# endpoints on the host network and giving pods visibility of all node network
# interfaces. Use only when the Kubernetes API server cannot reach pod-network
# webhook endpoints (e.g. clusters using a non-VPC CNI with NAT).
# WARNING: When hostNetwork is enabled, users are responsible for setting
# appropriate podAntiAffinity rules to prevent host-port conflicts between
# controller replicas on the same node.
# NOTE: hostNetwork mode is incompatible with telemetry sidecar mode
# (telemetry.mode=sidecar). This combination is rejected; 
hostNetwork: false

# Only modify this section if hostNetwork is enabled. When `hostNetwork` is
# enabled, each port is bound on the host network interface and must not clash
# with other workloads.
ports:
  # Port the controller webhook server listens on.
  webhook: 9443 # @schema minimum:1;maximum:65535
  # Port for the controller liveness and readiness probes.
  healthProbe: 8081 # @schema minimum:1;maximum:65535
  # Port for the controller Prometheus metrics endpoint.
  # Note: This is only used for the Service port; the pod-side metrics endpoint
  # is not bound to the host network interface even when hostNetwork is enabled.
  metrics: 8088 # @schema minimum:1;maximum:65535
# Verbosity of logging. Can be one of 'debug', 'info', 'error'.
logLevel: info
# open-telemetry options
telemetry:
  # Kubewarden controller telemetry configuration allow two OpenTelemetry
  # collector communication options:
  # - sidecar: It will create a Otel collector sidecar and configure the
  # controller and policy server to send metrics and traces to it.
  # - custom: It will configure the controller and policy server to send metrics
  # and traces to a custom collector that is not running as a sidecar.

  # The default configuration is to use the sidecar option. Therefore, if
  # telemetry.metrics or telemetry.tracing are set to true, the sidecar will be
  # deployed. If you want to use a custom collector, set mode to "custom"
  mode: sidecar
  # telemetry.metrics is used to enable/disable the metrics collection and
  # exportation to the OpenTelemetry collector.
  metrics: false
  # telemetry.tracing is used to enable/disable the tracing collection and
  # exportation to the OpenTelemetry collector.
  tracing: false

  # The following settings are mandatory to configure the OpenTelemetry
  # exporter in the controller and policy server to send metrics and traces to
  # a custom collector. These settings are ignored when sidecar mode is used
  custom:
    # telemetry.custom.endpoint is the Otel collector endpoint to send metrics and
    # traces to. It should be in the format https://<hostname>:<port>.
    endpoint: ""
    # telemetry.custom.insecure is used to configure the OpenTelemetry exporter to skip
    # the certificate validation when sending metrics and traces to a remote
    # collector.
    insecure: false
    # The following settings are required to configure the OpenTelemetry exporter
    # in the controller and policy server to send metrics and traces to a remote
    # collector using TLS. Both secrets must be created in the same namespace
    # where the controller is deployed.
    #
    # telemetry.custom.otelCollectorCertificateSecret should contains a key ca.crt
    # storing the certificate to validate the remote collector certificate.
    otelCollectorCertificateSecret: ""
    # telemetry.custom.otelCollectorClientCertificateSecret secret is optional. It's
    # only required when the remote collector requires client authentication
    # (mTLS). It should contains two keys: tls.crt and tls.key storing the client
    # certificate and key respectively.
    otelCollectorClientCertificateSecret: ""

  # The following settings are used to configure the Prometheus metrics and
  # Jaeger tracing when sidecar mode is used. Otherwise, these settings are ignored
  sidecar:
    # telemetry.sidecar.metrics is used to configure the Prometheus metrics exporter
    # in the Otel collector sidecar
    metrics:
      # port of the prometheus exporter and PolicyServer metric service
      port: 8080
    # telemetry.sidecar.tracing is used to configure the Jaeger tracing exporter
    # in the Otel collector sidecar
    tracing:
      jaeger: {}
      # OTLP/Jaeger endpoint to send traces to
      # endpoint: "all-in-one-collector.jaeger.svc.cluster.local:4317"
      # tls:
      #  insecure: true
image:
  # The registry is defined in the global.cattle.systemDefaultRegistry value
  # controller image to be used
  repository: "kubewarden/adm-controller/controller"
  # image tag
  tag: v1.37.0
  pullPolicy: IfNotPresent
preDeleteJob:
  image:
    # The registry is defined in the global.cattle.systemDefaultRegistry value
    # kuberlr-kubectl image to be used in the pre-delete helm hook.
    repository: "rancher/kuberlr-kubectl"
    tag: v8.1.1
# kubewarden-controller deployment settings:
podAnnotations: {}
nodeSelector: {}
# additionalEnvironmentVariables is a list of additional environment variables
# to inject into the controller container.
# Each entry is a standard Kubernetes EnvVar object (name, value, valueFrom, …).
# Example:
#   additionalEnvironmentVariables:
#     - name: MY_VAR
#       value: "my-value"
additionalEnvironmentVariables: []
# Resource limits & requests
# Ref: https://kubernetes.io/docs/user-guide/compute-resources/
resources:
  controller:
    limits:
      cpu: 500m
      memory: 200Mi
    requests:
      cpu: 250m
      memory: 70Mi
  auditScanner:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 300Mi
  preDeleteJob:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  postInstallJob:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
mTLS:
  # Enable mutual TLS authentication. This will require TLS connections with both
  # the server and client being authenticated, between the kubewarden
  # policy-servers and the Kubernetes API server, as well as between the
  # policy-servers and the audit-scanner.
  # Enabling this feature will require the Kubernetes API server to be
  # configured. If that is not achievable, consider using a service mesh.
  enable: false
  # name of the ConfigMap in kubewarden-controller namespace containing the
  # client CA certificate. The ConfigMap must contain a data.client-ca.crt key
  # with the CA cert in PEM format, encoded in base64.
  configMapName: ""
# Controller replicas
replicas: 1
auditScanner:
  enable: true
  policyReporter: false
  # The default audit-scanner ServiceAccount is bound to the ClusterRoles:
  # - view: Allows read-only access to most objects in a namespace.
  #   Does not allow viewing secrets, roles or role bindings.
  # - audit-scanner-cluster-role: Allows read-write to Kubewarden resources
  #   and Reports
  serviceAccountName: audit-scanner
  image:
    # The registry is defined in the common.cattle.systemDefaultRegistry value
    # kubectl image to be used in the pre-delete helm hook
    repository: "kubewarden/adm-controller/audit-scanner"
    tag: v1.37.0
    pullPolicy: IfNotPresent
  cronJob:
    schedule: "0 * * * *" # every 60 minutes
    failedJobsHistoryLimit: 5
    successfulJobsHistoryLimit: 3
  containerRestartPolicy: Never
  # Audit scanner allow users to use Kubernetes policy working group
  # PolicyReports CRDs or OpenReports CRDs to store the results of the
  # audits. Therefore, user can choose between: openreports or policyreport.
  # If not defined, the audit scanner default value is used.
  #
  # The CRDs used to store the audit scanner results must be installed in the
  # cluster. You can install both of them enabling the right flags in the
  # kubewarden-crds installation. If you want to use the PolicyReports CRDs,
  # enable the installPolicyReportCRDs flag. If you want to use the
  # OpenReports CRDs, enable the installOpenReportCRDs flag.
  reportCRDsKind: "openreports"
  # Additional namespaces that the audit scanner will not scan:
  skipAdditionalNamespaces: []
  # level of logs. One of trace, debug, info, warn, error, fatal
  logLevel: info
  # Output result of scan to stdout in JSON upon completion
  outputScan: false
  # Configures whether (Cluster)Reports are created, updated or deleted in
  # Kubernetes/etcd. When true, no (Cluster)Report is created, updated, or
  # deleted; existing reports are left untouched.
  disableStore: false
  # Configures the number of Namespaces to be audited in parallel
  parallelNamespaces: 1
  # Configures the number of resources to be audited in parallel
  parallelResources: 100
  # Configures the number of policies to evaluate for a given resource in parallel
  parallelPolicies: 5
  # Configures the number of resources to fetch from the Kubernetes API server when paginating
  pageSize: 100
# Values to configure the policy reporter subchart enabled by the
# auditScanner.policyReporter flag
policy-reporter:
  # image:
  #   registry: ghcr.io
  #   repository: kyverno/policy-reporter
  #   tag: ~
  ui:
    enabled: true
    # image:
    #   registry: ghcr.io
    #   repository: kyverno/policy-reporter-ui
    #   tag: ~
    views:
      logs: false
    logo:
      disabled: true
  sourceFilters:
    - selector:
        source: kubewarden

# crdVersion is the apiVersion used for all default policy and PolicyServer resources
crdVersion: "policies.kubewarden.io/v1"

# CRD installation toggles

# deploy policyreports.wgpolicyk8s.io, clusterpolicyreports.wgpolicyk8s.io CRDs
# Set to false if they are already defined inside of the cluster
#
# These reports are marked as DEPRECATED and its support will be removed in a
# future release, in favour of OpenReports.
installPolicyReportCRDs: false # @schema deprecated
# deploy reports.openreports.io, clusterreports.openreports.io CRDs
# Set to false if they are already defined inside of the cluster
installOpenReportsCRDs: true

# Policy Server settings
policyServer:
  enabled: true
  replicaCount: 1
  # Only one of minAvailable,maxUnavailable can be enabled:
  # minAvailable: 30%
  # maxUnavailable: 1
  image:
    # The registry is defined in the global.cattle.systemDefaultRegistry value
    repository: "kubewarden/adm-controller/policy-server"
    tag: v1.37.0
  serviceAccountName: policy-server
  # Configmap containing a Sigstore verification configuration under a key
  # named `verification-config`. Must be on the same ns as the PolicyServer.
  # verificationConfig: your_configmap

  # Configmap containing a Sigstore trust configuration (ClientTrustConfig JSON)
  # under a key named `sigstore-trust-config`. Must be on the same ns as the
  # PolicyServer. This is used to configure a custom Sigstore instance.
  # sigstoreTrustConfig: your_configmap

  permissions:
    # All permissions are cluster-wide. Even namespaced resources are
    # granted access in all namespaces at this time.
    # By default, permissions are given for get,list,watch unless verbs
    # are specified.
    - apiGroup: ""
      resources:
        - namespaces
        - pods
        - services
    - apiGroup: "networking.k8s.io"
      resources:
        - ingresses
    - apiGroup: "authorization.k8s.io"
      resources:
        - "subjectaccessreviews"
      verbs:
        - create
  env:
    - name: KUBEWARDEN_LOG_LEVEL
      value: info
  annotations: {}
  # follows the format of https://docs.kubewarden.io/reference/CRDs#policyserversecurity
  securityContexts: {}
  # imagePullSecret stores the secret name used to pull images from repositories.
  # The secret should be in the same namespace of the Policy Server
  #
  # Example of usage:
  # imagePullSecret: "mysecret"
  imagePullSecret: ""
  # insecureSources stores a list of allowed insecure registries.
  #
  # Example of usage:
  #insecureSources:
  #  - "source1"
  #  - "source2"
  # @schema item: string
  insecureSources: []
  # sourceAuthorities is a list of the URIs and their PEM encoded certificates
  # used to authenticate them
  #
  # Example of usage:
  # sourceAuthorities:
  #   - uri: "uri1"
  #     certs:
  #       - "cert1"
  #       - "cert2"
  #   - uri: "uri2"
  #     certs:
  #       - "cert3"
  #   - uri: "uri3"
  #     certs:
  #       - "cert4"
  # @schema type:[array]
  sourceAuthorities: []
  # namespacedPoliciesCapabilities lists host capability API calls allowed
  # for namespaced policies running on this PolicyServer.
  # Supported patterns: [] (none), "*" (all), "category/*",
  # "category/version/*", or specific paths.
  # Example:
  # namespacedPoliciesCapabilities:
  #   - "oci/*"
  #   - "net/v1/dns_lookup_host"
  namespacedPoliciesCapabilities: # @schema type:[array, null]
    - "*" # @schema minLength:1; anyOf: [{description: "Global wildcard", const: "*"}, {description: "Category wildcard: <category>/*", pattern: "^[a-z0-9_-]+/\\*$"}, {description: "Sub-category wildcard: <category>/<path...>/*", pattern: "^[a-z0-9_-]+(/[a-z0-9_-]+)+/\\*$"}, {description: "Fully-qualified capability path: <category>/<path...>", pattern: "^[a-z0-9_-]+(/[a-z0-9_-]+)+$"}]
  # limits and requests, see https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  limits: {}
  requests: {}
  # Port configuration for the policy server.
  # These ports are used for the webhook, readiness probe, and metrics endpoints.
  # Important when hostNetwork is enabled or when running multiple PolicyServers
  # on the same node, as they must not conflict.
  #
  # Default values (if not specified):
  # - webhookPort: 8443
  # - readinessProbePort: 8081
  # - metricsPort: default value defined in the controller (8080)
  #
  # webhookPort: 9443
  # readinessProbePort: 9081
  # metricsPort: 9080

  # affinity configures affinity rules for the default PolicyServer.
  # This takes precedence over global.affinity when set.
  # When hostNetwork is enabled, users should set appropriate podAntiAffinity
  # rules here to prevent host-port conflicts between PolicyServer replicas.
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #     - labelSelector:
  #         matchLabels:
  #           kubewarden/policy-server: default
  #       topologyKey: kubernetes.io/hostname
  affinity: {}

# Recommended policies configuration
recommendedPolicies:
  enabled: false
  # Used to define the registry where the Kubewarden policies are mirrored.
  # This can be useful if the registry used to mirror container images does
  # not support OCI artifacts.
  # If this field is not defined, the systemDefaultRegistry is used by default.
  defaultPoliciesRegistry: ""
  # Additional namespaces that recommended policies will not apply to:
  skipAdditionalNamespaces: []
  defaultPolicyMode: "monitor"

  allowPrivilegeEscalationPolicy:
    module:
      repository: "kubewarden/policies/allow-privilege-escalation-psp"
      tag: v1.0.12
    name: "no-privilege-escalation"
    settings:
      allowPrivilegeEscalation: false

  hostNamespacePolicy:
    module:
      repository: "kubewarden/policies/host-namespaces-psp"
      tag: v1.1.10
    name: "no-host-namespace-sharing"
    settings:
      allow_host_ipc: false
      allow_host_network: false
      allow_host_pid: false
      allow_host_ports: []

  podPrivilegedPolicy:
    module:
      repository: "kubewarden/policies/pod-privileged"
      tag: v1.0.12
    name: "no-privileged-pod"
    settings:
      skip_init_containers: false
      skip_ephemeral_containers: false

  userGroupPolicy:
    module:
      repository: "kubewarden/policies/user-group-psp"
      tag: v1.1.5
    name: "do-not-run-as-root"
    settings:
      run_as_user:
        rule: "MustRunAsNonRoot"
      run_as_group:
        rule: "RunAsAny"
      supplemental_groups:
        rule: "RunAsAny"
      validate_container_image_configuration: false

  hostPathsPolicy:
    module:
      repository: "kubewarden/policies/hostpaths-psp"
      tag: v1.1.9
    name: "do-not-share-host-paths"
    settings:
      allowedHostPaths:
        - pathPrefix: "/tmp"
          readOnly: true

  capabilitiesPolicy:
    module:
      repository: "kubewarden/policies/capabilities-psp"
      tag: v1.0.12
    name: "drop-capabilities"
    settings:
      allowed_capabilities: []
      required_drop_capabilities:
        - ALL
      default_add_capabilities: []
