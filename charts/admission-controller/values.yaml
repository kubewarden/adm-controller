controller:
  # The init container of the controller pod, and the pre-delete and
  # pre-upgrade Jobs, run this image too.
  image:
    # controller image to be used
    repository: "kubewarden/adm-controller/controller"
    # image tag
    tag: v1.39.0
    # Registry for the image. global.imageRegistry replaces it when set.
    registry: ghcr.io
    # Pull policy for the image. If it is empty, the chart uses common.imagePullPolicy, then global.imagePullPolicy.
    pullPolicy: ""
  # Controller replicas
  replicas: 1
  # Resource limits & requests
  # Ref: https://kubernetes.io/docs/user-guide/compute-resources/
  resources:
    limits:
      cpu: 500m
      memory: 200Mi
    requests:
      cpu: 250m
      memory: 70Mi
  # Security context for the pod.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Security context for the containers of the pod.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

