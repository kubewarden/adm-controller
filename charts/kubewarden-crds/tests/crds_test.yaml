      - equal:
          path: metadata.name
          value: admissionpolicygroups.policies.kubewarden.io
      - equal:
          path: spec.group
          value: policies.kubewarden.io
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: "clusteradmissionpolicies CRD should be a CustomResourceDefinition"
