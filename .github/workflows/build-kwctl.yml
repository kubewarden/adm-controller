name: kwctl build
on:
  workflow_call:
    inputs:
      force_build:
        description: "Force build even if no kwctl-related changes detected"
        required: false
        type: boolean
        default: false
      build_only:
        description: "Build only, skip signing/attestation/publishing"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no kwctl-related changes detected"
        required: false
        type: boolean
        default: false
      build_only:
        description: "Build only, skip signing/attestation/publishing"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "main"
      - "feat-**"

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect kwctl changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kwctl: ${{ steps.changed-files.outputs.kwctl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect kwctl-related file changes
        id: changed-files
        run: |
          # If force_build input is true (from workflow_call), always build
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "force_build=true, building kwctl"
            echo "kwctl=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine base ref for comparison
          BASE_REF="${{ github.event.before }}"
          # If first push to branch, compare with parent
          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="HEAD^"
          fi

          echo "Comparing against base: $BASE_REF"

          # Check for kwctl-related file changes
          KWCTL_CHANGES=$(git diff --name-only "$BASE_REF" HEAD | grep -E '^crates/(kwctl|policy-evaluator|policy-fetcher|burrego)/|^Cargo\.(toml|lock)$' || true)
          if [ -n "$KWCTL_CHANGES" ]; then
            echo "kwctl=true" >> $GITHUB_OUTPUT
            echo "kwctl-related files changed:"
            echo "$KWCTL_CHANGES"
          else
            echo "kwctl=false" >> $GITHUB_OUTPUT
            echo "No kwctl-related files changed"
          fi

  build-linux-binaries:
    name: Build linux binaries
    needs: changes
    if: needs.changes.outputs.kwctl == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - targetarch: aarch64
            runner: ubuntu-24.04-arm
          - targetarch: x86_64
            runner: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.build_only }}

      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Each architecture builds natively on its own runner, in the same way
      # the policy-server image is built. The binary is statically linked
      # against musl without cross-compiling. The Dockerfile exports only the
      # binary. BuildKit's own provenance and SBOM are off: the binary gets
      # its own below. There is no build cache on purpose: a cache that
      # other runs can write to would let them influence a release binary.
      - name: Build kwctl
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.kwctl
          outputs: type=local,dest=out
          provenance: false
          sbom: false

      - run: mv out/kwctl kwctl-linux-${{ matrix.targetarch }}

      - name: Smoke test build
        run: ./kwctl-linux-${{ matrix.targetarch }} --help

      - name: Generate attestations
        if: ${{ !inputs.build_only }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attestations
        with:
          subject-path: kwctl-linux-${{ matrix.targetarch }}

      - name: Sign kwctl
        if: ${{ !inputs.build_only }}
        run: |
          cosign sign-blob --yes \
            --bundle kwctl-linux-${{ matrix.targetarch }}.bundle.sigstore \
            kwctl-linux-${{ matrix.targetarch }}

      - run: zip -j9 kwctl-linux-${{ matrix.targetarch }}.zip kwctl-linux-${{ matrix.targetarch }} kwctl-linux-${{ matrix.targetarch }}.bundle.sigstore
        if: ${{ !inputs.build_only }}

      - name: Upload binary
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-linux-${{ matrix.targetarch }}
          path: kwctl-linux-${{ matrix.targetarch }}.zip

      - name: Install the syft command
        if: ${{ !inputs.build_only }}
        uses: kubewarden/github-actions/syft-installer@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0

      - name: Create SBOM file
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          syft scan \
          --output spdx-json=kwctl-linux-${{ matrix.targetarch }}-sbom.spdx \
          --source-name kwctl-linux-${{ matrix.targetarch }} \
          --source-version ${{ github.sha }} \
          -vv \
          dir:. # use dir default catalogers, which includes Cargo.toml

      - name: Sign SBOM file
        if: ${{ !inputs.build_only }}
        run: |
          cosign sign-blob --yes \
            --bundle kwctl-linux-${{ matrix.targetarch }}-sbom.spdx.bundle.sigstore \
            kwctl-linux-${{ matrix.targetarch }}-sbom.spdx

      - name: Upload kwctl SBOM files
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-linux-${{ matrix.targetarch }}-sbom
          path: |
            kwctl-linux-${{ matrix.targetarch }}-sbom.spdx
            kwctl-linux-${{ matrix.targetarch }}-sbom.spdx.bundle.sigstore

      - name: Upload kwctl air gap scripts
        if: ${{ !inputs.build_only && matrix.targetarch == 'x86_64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-airgap-scripts
          path: |
            scripts/kubewarden-load-policies.sh
            scripts/kubewarden-save-policies.sh

  build-darwin-binaries:
    name: Build darwin binary
    needs: changes
    if: needs.changes.outputs.kwctl == 'true'
    strategy:
      matrix:
        targetarch: ["aarch64", "x86_64"]
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.build_only }}

      - run: rustup target add ${{ matrix.targetarch }}-apple-darwin

      # macos-latest is an arm64 machine, so the tool is always the arm64 one,
      # also when the target is x86_64.
      - name: Install cargo-auditable
        shell: bash
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSfL -o cargo-auditable.tar.xz \
            "https://github.com/rust-secure-code/cargo-auditable/releases/download/${AUDITABLE_VERSION}/cargo-auditable-aarch64-apple-darwin.tar.xz"
          echo "${AUDITABLE_CHECKSUM}  cargo-auditable.tar.xz" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xJf cargo-auditable.tar.xz --strip-components=1 -C "$HOME/.cargo/bin" \
            cargo-auditable-aarch64-apple-darwin/cargo-auditable
          rm cargo-auditable.tar.xz
        env:
          # renovate: datasource=github-release-attachments depName=rust-secure-code/cargo-auditable
          AUDITABLE_VERSION: "v0.7.7"
          # renovate: datasource=github-release-attachments depName=rust-secure-code/cargo-auditable digestVersion=v0.7.7
          AUDITABLE_CHECKSUM: "a66ad6392861ca1abfe0b02b522622d91edf63e5d7b60f4d3088b5c23d240c72"

      - name: Build kwctl
        run: cargo auditable build --locked --target=${{ matrix.targetarch }}-apple-darwin --release -p kwctl

      - run: mv target/${{ matrix.targetarch }}-apple-darwin/release/kwctl kwctl-darwin-${{ matrix.targetarch }}

      - name: Smoke test build
        if: matrix.targetarch == 'x86_64'
        run: ./kwctl-darwin-x86_64 --help

      - name: Generate attestations
        if: ${{ !inputs.build_only }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attestations
        with:
          subject-path: kwctl-darwin-${{ matrix.targetarch }}

      - name: Sign kwctl
        if: ${{ !inputs.build_only }}
        run: |
          cosign sign-blob --yes \
            --bundle kwctl-darwin-${{ matrix.targetarch }}.bundle.sigstore \
            kwctl-darwin-${{ matrix.targetarch }}

      - run: zip -j9 kwctl-darwin-${{ matrix.targetarch }}.zip kwctl-darwin-${{ matrix.targetarch }} kwctl-darwin-${{ matrix.targetarch }}.bundle.sigstore
        if: ${{ !inputs.build_only }}

      - name: Upload binary
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-darwin-${{ matrix.targetarch }}
          path: kwctl-darwin-${{ matrix.targetarch }}.zip

      - name: Install the syft command
        if: ${{ !inputs.build_only }}
        uses: kubewarden/github-actions/syft-installer@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
        with:
          arch: darwin_amd64

      - name: Create SBOM file
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          syft scan \
          --output spdx-json=kwctl-darwin-${{ matrix.targetarch }}-sbom.spdx \
          --source-name kwctl-darwin-${{ matrix.targetarch }} \
          --source-version ${{ github.sha }} \
          -vv \
          dir:. # use dir default catalogers, which includes Cargo.toml

      - name: Sign SBOM file
        if: ${{ !inputs.build_only }}
        run: |
          cosign sign-blob --yes \
            --bundle kwctl-darwin-${{ matrix.targetarch }}-sbom.spdx.bundle.sigstore \
            kwctl-darwin-${{ matrix.targetarch }}-sbom.spdx

      - name: Upload kwctl SBOM files
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-darwin-${{ matrix.targetarch }}-sbom
          path: |
            kwctl-darwin-${{ matrix.targetarch }}-sbom.spdx
            kwctl-darwin-${{ matrix.targetarch }}-sbom.spdx.bundle.sigstore

  build-windows-x86_64:
    name: Build windows (x86_64) binary
    needs: changes
    if: needs.changes.outputs.kwctl == 'true'
    strategy:
      matrix:
        # workaround to have the same GH UI for all jobs
        targetarch: ["x86_64"]
        os: ["windows-latest"]
    runs-on: ${{ matrix.os }}
    env:
      # aws-lc-sys has a CMakefile directive that cmake v4 removed. This
      # variable lets the build work with cmake v4.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.build_only }}

      - name: Install cargo-auditable
        shell: bash
        run: |
          set -e

          curl --proto '=https' --tlsv1.2 -sSfL -o cargo-auditable.zip \
            "https://github.com/rust-secure-code/cargo-auditable/releases/download/${AUDITABLE_VERSION}/cargo-auditable-x86_64-pc-windows-msvc.zip"
          echo "${AUDITABLE_CHECKSUM}  cargo-auditable.zip" | sha256sum -c -
          mkdir -p "$HOME/.cargo/bin"
          "/c/Program Files/7-Zip/7z.exe" e cargo-auditable.zip cargo-auditable.exe \
            -o"$(cygpath -w "$HOME/.cargo/bin")" -y
          rm cargo-auditable.zip
        env:
          # renovate: datasource=github-release-attachments depName=rust-secure-code/cargo-auditable
          AUDITABLE_VERSION: "v0.7.7"
          # renovate: datasource=github-release-attachments depName=rust-secure-code/cargo-auditable digestVersion=v0.7.7
          AUDITABLE_CHECKSUM: "717ba2d3ed7997c501e9987ee7c94bebf9d7219b18b185a03009420ec7029c7d"

      - name: Build kwctl
        run: cargo auditable build --locked --target=x86_64-pc-windows-msvc --release -p kwctl

      - run: mv target/x86_64-pc-windows-msvc/release/kwctl.exe kwctl-windows-x86_64.exe

      - name: Smoke test build
        run: .\kwctl-windows-x86_64.exe --help

      - name: Generate attestations
        if: ${{ !inputs.build_only }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attestations
        with:
          subject-path: kwctl-windows-${{ matrix.targetarch }}.exe

      - name: Sign kwctl
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle kwctl-windows-x86_64.bundle.sigstore \
            kwctl-windows-x86_64.exe

      - run: |
          "/c/Program Files/7-Zip/7z.exe" a kwctl-windows-x86_64.exe.zip kwctl-windows-x86_64.exe kwctl-windows-x86_64.bundle.sigstore
        shell: bash
        if: ${{ !inputs.build_only }}

      - name: Upload binary
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-windows-x86_64
          path: kwctl-windows-x86_64.exe.zip

      - name: Install the syft command
        if: ${{ !inputs.build_only }}
        uses: kubewarden/github-actions/syft-installer@4d25ea5d35d22768786526f592b0f9ba27587c9c # v8.0.0
        with:
          arch: windows_amd64

      - name: Create SBOM file
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          syft scan \
          --output spdx-json=kwctl-windows-x86_64-sbom.spdx \
          --source-name kwctl-windows-x86_64 \
          --source-version ${{ github.sha }} \
          -vv \
          dir:. # use dir default catalogers, which includes Cargo.toml

      - name: Sign SBOM
        if: ${{ !inputs.build_only }}
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle kwctl-windows-x86_64-sbom.spdx.bundle.sigstore \
            kwctl-windows-x86_64-sbom.spdx

      - name: Upload kwctl SBOM files
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwctl-windows-x86_64-sbom
          path: |
            kwctl-windows-x86_64-sbom.spdx
            kwctl-windows-x86_64-sbom.spdx.bundle.sigstore
