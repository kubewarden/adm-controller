name: Release
on:
  push:
    tags:
      - "v*"

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  version-check:
    name: Check Cargo.toml files version
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check cargo file version
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          CARGO_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' crates/kwctl/Cargo.toml)
          POLICY_SERVER_VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' crates/policy-server/Cargo.toml)
          TAG_VERSION="${GIT_REF_NAME#v}"

          if [ "$CARGO_VERSION" != "$TAG_VERSION" ];then
              echo "::error title=Invalid Cargo.toml version::crates/kwctl/Cargo.toml version does not match the tag version"
              exit 1
          fi

          if [ "$POLICY_SERVER_VERSION" != "$TAG_VERSION" ];then
              echo "::error title=Invalid Cargo.toml version::crates/policy-server/Cargo.toml version does not match the tag version"
              exit 1
          fi

  ci:
    needs: version-check
    uses: $/.github/workflows/ci.yml
    # Specify all permissions explicitly - read for most, write for attestations
    permissions:
      actions: read
      artifact-metadata: read
      attestations: write
      checks: read
      contents: read
      deployments: read
      discussions: read
      id-token: write
      issues: read
      models: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
    with:
      run_all: true

  build-containers:
    name: Build, sign and attest container images
    permissions:
      contents: read # Checkout private forks
      packages: write # Pushing images to ghcr.io
      id-token: write # Signing images with cosign and actions/attest
      attestations: write # actions/attest (SLSA L3 provenance)
    uses: kubewarden/github-actions/.github/workflows/container-release.yml@d12b2b18e1f9dbfe15c79c9ecb7149cf956704a7 # v8.1.0
    with:
      components: '["policy-server","controller","audit-scanner"]'
      image-namespace: ${{ github.event.repository.name }}
      version: ${{ github.ref_name }}

  build-kwctl:
    name: Build kwctl binaries
    uses: $/.github/workflows/build-kwctl.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      force_build: true

  release:
    name: Create release

    needs:
      - ci
      - build-containers
      - build-kwctl

    permissions:
      contents: write
      attestations: read # gh attestation verify

    runs-on: ubuntu-latest

    steps:
      - name: Retrieve tag name
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          echo TAG_NAME=$(echo "$GIT_REF_NAME") >> $GITHUB_ENV
      - name: Get latest release tag
        id: get_last_release_tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let release = await github.rest.repos.getLatestRelease({
               owner: context.repo.owner,
               repo: context.repo.repo,
            });

            if (release.status  === 200 ) {
              core.setOutput('old_release_tag', release.data.tag_name)
              return
            }
            core.setFailed("Cannot find latest release")
      - name: Get release ID from the release created by release drafter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let releases = await github.rest.repos.listReleases({
               owner: context.repo.owner,
               repo: context.repo.repo,
            });
            for (const release of releases.data) {
              if (release.draft) {
                      core.info(release)
                      core.exportVariable('RELEASE_ID', release.id)
                      return
              }
            }
            core.setFailed(`Draft release not found`)
      - name: Download attestation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: attestation-*
          merge-multiple: true
      - name: Download kwctl artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kwctl-*
          merge-multiple: false
      - name: Display structure of downloaded files
        run: ls -R
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Publish a kwctl binary only if it was built and signed by build-kwctl.yml
      # of this repository, at the commit of this release. Any failure here
      # stops the release before it uploads anything.
      - name: Verify the kwctl binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_REF_NAME: ${{ github.ref_name }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -e

          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/build-kwctl.yml"
          signer_identity_regexp="^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build-kwctl\.yml@"

          verify_blob() {
            cosign verify-blob \
              --bundle "$1.bundle.sigstore" \
              --certificate-oidc-issuer="$OIDC_ISSUER" \
              --certificate-identity-regexp="$signer_identity_regexp" \
              --certificate-github-workflow-repository="$GITHUB_REPOSITORY" \
              --certificate-github-workflow-ref="refs/tags/${GIT_REF_NAME}" \
              --certificate-github-workflow-sha="$GITHUB_SHA" \
              "$1"
          }

          for target in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64 windows-x86_64; do
            binary="kwctl-${target}"

            workdir=$(mktemp -d)
            unzip -q "kwctl-${target}"/*.zip -d "$workdir"

            # On Windows the binary has the ".exe" extension, but its bundle
            # does not. Rename the bundle to what verify_blob expects.
            if [ "$target" = "windows-x86_64" ]; then
              binary="${binary}.exe"
              mv "${workdir}/kwctl-${target}.bundle.sigstore" "${workdir}/${binary}.bundle.sigstore"
            fi

            gh attestation verify "${workdir}/${binary}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "refs/tags/${GIT_REF_NAME}"

            verify_blob "${workdir}/${binary}"

            sbom="kwctl-${target}-sbom/kwctl-${target}-sbom.spdx"
            verify_blob "$sbom"

            # All the SBOMs of a release have the same signer, commit and tag.
            # The signature does not say which binary an SBOM describes, so
            # read that from the SBOM.
            sbom_name=$(jq -r '.name' "$sbom")
            if [ "$sbom_name" != "kwctl-${target}" ]; then
              echo "::error::$sbom describes $sbom_name, not kwctl-${target}"
              exit 1
            fi
          done
      - name: Upload release assets
        id: upload_release_assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let fs = require('fs');
            let path = require('path');

            let files = [
              'controller-attestation-amd64-provenance.intoto.jsonl',
              'controller-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
              'controller-attestation-arm64-provenance.intoto.jsonl',
              'controller-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
              'controller-attestation-amd64-sbom.json',
              'controller-attestation-amd64-sbom.json.bundle.sigstore',
              'controller-attestation-arm64-sbom.json',
              'controller-attestation-arm64-sbom.json.bundle.sigstore',
              'audit-scanner-attestation-amd64-provenance.intoto.jsonl',
              'audit-scanner-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
              'audit-scanner-attestation-arm64-provenance.intoto.jsonl',
              'audit-scanner-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
              'audit-scanner-attestation-amd64-sbom.json',
              'audit-scanner-attestation-amd64-sbom.json.bundle.sigstore',
              'audit-scanner-attestation-arm64-sbom.json',
              'audit-scanner-attestation-arm64-sbom.json.bundle.sigstore',
              'policy-server-attestation-amd64-provenance.intoto.jsonl',
              'policy-server-attestation-amd64-provenance.intoto.jsonl.bundle.sigstore',
              'policy-server-attestation-arm64-provenance.intoto.jsonl',
              'policy-server-attestation-arm64-provenance.intoto.jsonl.bundle.sigstore',
              'policy-server-attestation-amd64-sbom.json',
              'policy-server-attestation-amd64-sbom.json.bundle.sigstore',
              'policy-server-attestation-arm64-sbom.json',
              'policy-server-attestation-arm64-sbom.json.bundle.sigstore',
              './kwctl-airgap-scripts/kubewarden-load-policies.sh',
              './kwctl-airgap-scripts/kubewarden-save-policies.sh',
              './kwctl-darwin-aarch64/kwctl-darwin-aarch64.zip',
              './kwctl-darwin-aarch64-sbom/kwctl-darwin-aarch64-sbom.spdx',
              './kwctl-darwin-aarch64-sbom/kwctl-darwin-aarch64-sbom.spdx.bundle.sigstore',
              './kwctl-darwin-x86_64/kwctl-darwin-x86_64.zip',
              './kwctl-darwin-x86_64-sbom/kwctl-darwin-x86_64-sbom.spdx',
              './kwctl-darwin-x86_64-sbom/kwctl-darwin-x86_64-sbom.spdx.bundle.sigstore',
              './kwctl-linux-aarch64/kwctl-linux-aarch64.zip',
              './kwctl-linux-aarch64-sbom/kwctl-linux-aarch64-sbom.spdx',
              './kwctl-linux-aarch64-sbom/kwctl-linux-aarch64-sbom.spdx.bundle.sigstore',
              './kwctl-linux-x86_64/kwctl-linux-x86_64.zip',
              './kwctl-linux-x86_64-sbom/kwctl-linux-x86_64-sbom.spdx',
              './kwctl-linux-x86_64-sbom/kwctl-linux-x86_64-sbom.spdx.bundle.sigstore',
              './kwctl-windows-x86_64/kwctl-windows-x86_64.exe.zip',
              './kwctl-windows-x86_64-sbom/kwctl-windows-x86_64-sbom.spdx',
              './kwctl-windows-x86_64-sbom/kwctl-windows-x86_64-sbom.spdx.bundle.sigstore']
            const {RELEASE_ID} = process.env

            for (const file of files) {
              let file_data = fs.readFileSync(file);

              let response = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: `${RELEASE_ID}`,
                name: path.basename(file),
                data: file_data,
              });
            }
      - name: Publish release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {RELEASE_ID} = process.env
            const {TAG_NAME} = process.env
            isPreRelease = ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: `${RELEASE_ID}`,
              draft: false,
              tag_name: `${TAG_NAME}`,
              name: `${TAG_NAME}`,
              prerelease: isPreRelease,
              make_latest: !isPreRelease
            });

  sync-helm-charts:
    name: Trigger Helm Charts Sync Workflow
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }}
          repositories: |
            helm-charts
          # minimum permissions to trigger a repository_dispatch on helm-charts:
          permission-contents: write
      - name: Trigger chart update
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
          GIT_REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          jq -n \
            --arg source_repo "$SOURCE_REPO" \
            --arg tag "$GIT_REF_NAME" \
            '{"event_type":"release-adm-controller","client_payload":{"source_repo":$source_repo,"tag":$tag}}' \
            > payload.json
          gh api "repos/$REPO_OWNER/helm-charts/dispatches" \
            -X POST \
            --input payload.json
