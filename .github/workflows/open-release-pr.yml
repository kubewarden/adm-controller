on:
  workflow_dispatch:
    inputs:
      version:
        description: "stack version (E.g: v1.39.0-rc.2)"
        required: true
        type: string

name: Open release PR

permissions: {}

jobs:
  open-release-pr:
    name: "Open PR to release Admission Controller"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }} # the default
          repositories: ${{ github.event.repository.name }}
          # minimum permissions for updatecli to push a branch and open a PR:
          permission-contents: write
          permission-pull-requests: write
          permission-members: read # request reviews from the teams in .pr.reviewers

      - name: Install cargo-set-version
        run: cargo install --locked --version 0.13.9 cargo-edit

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@93ae2608256484ef8598e902aa675bbc9e278e4e # v3.10.0

      - name: Install helm
        # Helm and helm plugins installation required by the updatecli release action
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # helm --verify=false flag only exists on Helm >= 4
          version: v4.3.1

      - name: Install helm values schema json plugin
        # Disable plugin verification until helm v4 is supported
        run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --verify=false

      - name: Delete the updatecli working branch (and close existing PR)
        # Workaround for https://github.com/updatecli/updatecli/issues/11278 :
        #   Updatecli reuses an existing working branch. If that branch is behind
        #   main, updatecli v0.123.0 force-pushes main over its own commits and
        #   opens no PR. Deleting the branch also closes any open release PR.
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: ${{ github.repository }}
          # From the "branch" and "pipelineid" values in updatecli/values/
          WORKING_BRANCH: updatecli_main_release_pr
        run: |-
          matches=$(gh api "repos/$REPO/git/matching-refs/heads/$WORKING_BRANCH" \
            --jq 'map(select(.ref == "refs/heads/" + env.WORKING_BRANCH)) | length')
          if [ "$matches" -gt 0 ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$WORKING_BRANCH"
            echo "Deleted branch $WORKING_BRANCH"
          else
            echo "Branch $WORKING_BRANCH does not exist"
          fi

      - name: Open PR with updatecli
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          UPDATECLI_GITHUB_OWNER: ${{ github.repository_owner }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |-
          updatecli compose apply --file ./updatecli/open-release-pr.yaml
