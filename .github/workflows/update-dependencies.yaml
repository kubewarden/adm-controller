name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1" # 3:30 on Monday

jobs:
  update-dependencies:
    name: Update Go version, Helm chart dependencies, Hauler manifest, ArtifactHub annot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@ca8c01bf875e2520512c344a71dd02f3dc3326a7 # v3.7.0
        with:
          # The version is pinned for now to workaround an issue found during
          # the compose file exectution when updatecli reports "something wrong
          # happen" for the conditions
          version: v0.109.0

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          owner: ${{ github.repository_owner }} # the default
          repositories: ${{ github.event.repository.name }}
          # minimum permissions for updatecli to push a branch and open a PR:
          # (no permissions to bump deps in github workflows)
          permission-contents: write
          permission-pull-requests: write

      - name: Update all dependencies
        env:
          UPDATECLI_GITHUB_OWNER: ${{ github.repository_owner }}
          UPDATECLI_GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          UPDATECLI_GITHUB_APP_INSTALLATION_ID: "${{ secrets.APP_INSTALLATION_ID }}" # zizmor: ignore[secrets-outside-env]
        run: |-
          updatecli compose apply --file ./updatecli/update-deps.yaml
