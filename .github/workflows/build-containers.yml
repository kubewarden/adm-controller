name: Build, Sign, and Generate SBOM, Attestation & Provenance

on:
  push:
    branches:
      - "main"
      - "feat-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        component: [policy-server, controller, audit-scanner]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read # Checkout private forks
      packages: write # Pushing images to ghcr.io
      id-token: write # Signing images with cosign
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, sign, and upload digest
        uses: kubewarden/github-actions/container-build@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1
        with:
          component: ${{ matrix.component }}
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          namespace: ${{ github.event.repository.name }}

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: write # Pushing multi-arch manifest to ghcr.io
      id-token: write # Signing images with cosign
    strategy:
      matrix:
        component: [policy-server, controller, audit-scanner]
    steps:
      - name: Retrieve tag name (main)
        if: ${{ startsWith(github.ref, 'refs/heads/main') }}
        run: |
          echo TAG_NAME=latest >> $GITHUB_ENV
      - name: Retrieve tag name (feat branch)
        if: ${{ startsWith(github.ref, 'refs/heads/feat') }}
        run: |
          echo "TAG_NAME=latest-$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
      - name: Merge multi-arch images
        uses: kubewarden/github-actions/merge-multiarch@143b9e4b11ddc47370482267383586e6f1bc7efe # v7.0.1
        with:
          component: ${{ matrix.component }}
          tag: ${{ env.TAG_NAME }}
          arch: amd64,arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          namespace: ${{ github.event.repository.name }}
