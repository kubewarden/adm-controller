name: Build and sign container images (main and feat branches)

# Builds and signs the images of the `main` branch under the `latest` tag,
# and the images of a `feat-*` branch under the `latest-feat-*` tag. Tagged
# releases go through release.yml, which calls the same reusable workflow
# with a `version`.

# No default token permissions. Each job declares exactly what it needs.
permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "feat-**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # Checkout private forks
      packages: write # Pushing images to ghcr.io
      id-token: write # Signing images with cosign and actions/attest
      attestations: write # actions/attest (SLSA L3 provenance)
    # TODO: bump to the v8.0.0 SHA once kubewarden/github-actions tags the final release.
    uses: kubewarden/github-actions/.github/workflows/container-release.yml@4889838ce13fb6f18230f78a186cc8d9b469fa61 # v8.0.0-rc.2
    with:
      components: '["policy-server","controller","audit-scanner"]'
      image-namespace: ${{ github.event.repository.name }}
      # main -> latest; feat-foo -> latest-feat-foo
      tag: ${{ github.ref_name == 'main' && 'latest' || format('latest-{0}', github.ref_name) }}
