name: Update charts with new policy-reporter version

# {{ if .pipelineid }}
pipelineid: "{{ .pipelineid }}"
# {{ end }}

sources:
  # {{ range $chart := .helmCharts}}
  # {{ if $chart.repository }}
  "source/{{ $chart.name }}Chart":
    kind: helmchart
    spec:
      url: "{{ $chart.repository }}"
      name: "{{ $chart.name }}"
  # {{ end }}
  # {{ end }}

targets:
  # {{ range $chart := .helmCharts}}
  # {{ if $chart.repository }}
  "target/{{ $chart.name }}Chart":
    name: "Update {{ $chart.name }} dependency helm chart"
    kind: yaml
    sourceid: "source/{{ $chart.name }}Chart"
    scmid: "default"
    dependson:
      - '{{ printf "source#source/%sChart" $chart.name }}'
    spec:
      file: "{{ $chart.file }}"
      key: "{{ $chart.versionKey }}"
  # {{ end }}
  # {{ if eq $chart.name "policy-reporter" }}
  target/updateDependenciesLockFile:
    name: Call helm dependency update command to update the lock file
    kind: shell
    disablesourceinput: true
    scmid: "default"
    dependson:
      - '{{ printf "target#target/%sChart" $chart.name }}'
    spec:
      command: |
        helm dependency update charts/admission-controller
      changedif:
        kind: file/checksum
        spec:
          files:
            - charts/admission-controller/Chart.lock
  # {{ end }}
  # {{ end }}

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.author }}"
      email: "{{ .github.email }}"
      owner: "{{ requiredEnv .github.owner }}"
      repository: "adm-controller"
      branch: "{{ .github.branch }}"
      commitmessage:
        type: "chore"
        scope: deps
        title: "Update Helm charts dependencies"
        hidecredit: true
        footers: "Signed-off-by: adm-controller bot <adm-controller-bot@users.noreply.github.com>"
