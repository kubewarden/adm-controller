name: Update Hauler manifest with versions from Helm chart

# {{ if .pipelineid }}
pipelineid: "{{ .pipelineid }}"
# {{ end }}

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.author }}"
      email: "{{ .github.email }}"
      owner: "{{ requiredEnv .github.owner }}"
      repository: "adm-controller"
      branch: "{{ .github.branch }}"
      commitmessage:
        type: "chore"
        scope: deps
        title: "Update dependencies in Hauler manifest"
        footers: "Signed-off-by: adm-controller bot <adm-controller-bot@users.noreply.github.com>"
        hidecredit: true

sources:
  # {{ range $oci := .ociArtifacts}}
  "source/{{ $oci.image }}Version":
    kind: yaml
    scmid: default
    spec:
      file: "{{ $oci.file }}"
      key: "{{ $oci.key}}"
  # {{ end }}
  # {{ range $i, $chart := .helmCharts}}
  "source/{{ $chart.name}}ChartVersion":
    kind: yaml
    scmid: default
    spec:
      file: "{{ $chart.file }}"
      key: "{{ $chart.versionKey }}"
  # {{ end }}
  policyReporterChartAppVersion:
    name: "Get appVersion from policy-reporter chart"
    kind: yaml
    dependson:
      - source/policy-reporterChartVersion
    spec:
      file: 'https://raw.githubusercontent.com/kyverno/policy-reporter/refs/tags/policy-reporter-{{ source "source/policy-reporterChartVersion" }}/charts/policy-reporter/Chart.yaml'
      key: "$.appVersion"
  policyReporterChartUIImageTagValue:
    name: "Get ui.image.tag value from policy-reporter chart"
    kind: yaml
    transformers:
      - trimprefix: '"'
      - trimsuffix: '"'
    dependson:
      - source/policy-reporterChartVersion
    spec:
      file: 'https://raw.githubusercontent.com/kyverno/policy-reporter/refs/tags/policy-reporter-{{ source "source/policy-reporterChartVersion" }}/charts/policy-reporter/values.yaml'
      key: "$.ui.image.tag"

# {{ if .helmCharts}}
conditions:
  # Adding this condition just to ensure that the policy-reporter chart is in
  # the expected position. Hopefully, we could find a better way to do that in
  # the target below. See why this is necessary in the target comment
  # {{ range $i, $chart := .helmCharts}}
  "condition/{{ $chart.name}}Position":
    kind: yaml
    disablesourceinput: true
    spec:
      file: "charts/hauler_manifest.yaml"
      # The Charts document is the fourth document of the Hauler manifest.
      # Without documentindex, updatecli evaluates every document, and the
      # other documents have no spec.charts key.
      documentindex: 3
      key: "$.spec.charts[{{ $i }}].name"
      value: "{{ $chart.name }}"
  # {{ end }}
# {{ end }}

targets:
  # {{ range $oci := .ociArtifacts}}
  "target/{{ $oci.image }}":
    name: "Update {{ $oci.image }} image in Hauler manifest"
    kind: file
    sourceid: "source/{{ $oci.image }}Version"
    scmid: "default"
    dependson:
      - '{{ printf "source#source/%sVersion" $oci.image }}'
    spec:
      file: "charts/hauler_manifest.yaml"
      matchpattern: "(.*)- ?name: ?{{ $oci.image }}:(v?.+) ?(.*)"
      replacepattern: '$1- name: {{ $oci.image }}:{{ printf "source/%sVersion" $oci.image | source }}'
  # {{ end }}
  # {{ range $i, $chart := .helmCharts}}
  "target/{{ $chart.name}}Chart":
    name: "Update {{ $chart.name }} Helm chart version in Hauler manifest"
    kind: yaml
    sourceid: "source/{{  $chart.name }}ChartVersion"
    scmid: "default"
    dependson:
      - '{{ printf "condition#condition/%sPosition" $chart.name }}'
    spec:
      file: "charts/hauler_manifest.yaml"
      documentindex: 3
      # Yamlpath to filter the helm chart by name did not work. That's why we
      # have the condition to ensure the script is not updating the wrong helm
      # chart
      key: "$.spec.charts[{{ $i }}].version"
  # {{ end }}
  policyReporterImage:
    name: "Update policy-reporter image in Hauler manifest"
    kind: file
    sourceid: policyReporterChartAppVersion
    scmid: default
    spec:
      file: "charts/hauler_manifest.yaml"
      matchpattern: "(.*)- ?name: ?ghcr.io/kyverno/policy-reporter:(v?.+) ?(.*)"
      replacepattern: '$1- name: ghcr.io/kyverno/policy-reporter:{{ source "policyReporterChartAppVersion" }}'
  policyReporterUIImage:
    name: "Update policy-reporter-ui image in Hauler manifest"
    kind: file
    sourceid: policyReporterChartUIImageTagValue
    scmid: default
    spec:
      file: "charts/hauler_manifest.yaml"
      matchpattern: "(.*)- ?name: ?ghcr.io/kyverno/policy-reporter-ui:(v?.+) ?(.*)"
      replacepattern: '$1- name: ghcr.io/kyverno/policy-reporter-ui:{{ source "policyReporterChartUIImageTagValue" }}'

  # The following targets keep the artifacthub.io/images annotation, in
  # charts/admission-controller/Chart.yaml, in sync with the image tags in
  # values.yaml.
  # {{ range $oci := .ociArtifacts }}
  "target/{{ $oci.image }}ArtifactHubAnnotation":
    name: "Update {{ $oci.image }} image in artifacthub.io/images annotation"
    kind: file
    sourceid: "source/{{ $oci.image }}Version"
    scmid: "default"
    dependson:
      - '{{ printf "source#source/%sVersion" $oci.image }}'
    spec:
      file: "charts/admission-controller/Chart.yaml"
      matchpattern: "image: {{ $oci.image }}:(v?\\S+)"
      replacepattern: 'image: {{ $oci.image }}:{{ printf "source/%sVersion" $oci.image | source }}'
  # {{ end }}
  policyReporterArtifactHubAnnotation:
    name: "Update policy-reporter image in artifacthub.io/images annotation"
    kind: file
    sourceid: policyReporterChartAppVersion
    scmid: default
    spec:
      file: "charts/admission-controller/Chart.yaml"
      matchpattern: "image: ghcr\\.io/kyverno/policy-reporter:(v?\\S+)"
      replacepattern: 'image: ghcr.io/kyverno/policy-reporter:{{ source "policyReporterChartAppVersion" }}'
  policyReporterUIArtifactHubAnnotation:
    name: "Update policy-reporter-ui image in artifacthub.io/images annotation"
    kind: file
    sourceid: policyReporterChartUIImageTagValue
    scmid: default
    spec:
      file: "charts/admission-controller/Chart.yaml"
      matchpattern: "image: ghcr\\.io/kyverno/policy-reporter-ui:(v?\\S+)"
      replacepattern: 'image: ghcr.io/kyverno/policy-reporter-ui:{{ source "policyReporterChartUIImageTagValue" }}'

# {{ if .pr.haulerUpdatePr }}
actions:
  openUpdatePR:
    title: "chore(deps): Update Helm chart dependencies"
    kind: "github/pullrequest"
    scmid: "default"
    spec:
      automerge: false
      mergemethod: squash
      description: |
        Automatic update of the policy-reporter Helm chart dependency, the Hauler manifest, and the artifacthub.io/images annotation.
        This PR has been created by automation.

        > [!IMPORTANT]
        > REMEMBER USING SQUASH MERGE FOR THIS PR
      #     {{ if .pr.reviewrs }}
      reviewers:
        #           {{ range .pr.reviewers }}
        - "{{ . }}"
      #           {{ end }}
      #     {{ end }}
      #     {{ if .pr.labels }}
      labels:
        #         {{ range .pr.labels }}
        - "{{ . }}"
      #           {{ end }}
      #     {{ end }}
# {{ end }}
