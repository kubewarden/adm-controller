# The following values are used to update the Hauler manifest.
# The ociArtifacts list all the container images that need
# to be updated in the manifest
ociArtifacts:
  - file: "charts/admission-controller/values.yaml"
    key: "$.image.tag"
    image: "ghcr.io/kubewarden/adm-controller/controller"
  - file: "charts/admission-controller/values.yaml"
    key: "$.auditScanner.image.tag"
    image: "ghcr.io/kubewarden/adm-controller/audit-scanner"
  - file: "charts/admission-controller/values.yaml"
    key: "$.policyServer.image.tag"
    image: "ghcr.io/kubewarden/adm-controller/policy-server"
# The helmCharts lists the charts that need to be updated also in Hauler:
# - adm-controller chart
# - policy-reporter subchart. The policy-reporter-ui image tag needs to be
#   updated in Hauler, but there's no datasource. We could expose it in
#   .Values.policy-reporter.ui.image.tag but we are punting on that.
#
# This list should be in the same order as defined in the
# charts/hauler_manifest.yaml file.
helmCharts:
  - name: admission-controller
    file: "charts/admission-controller/Chart.yaml"
    versionKey: "$.version"
  - name: policy-reporter
    file: "charts/admission-controller/Chart.yaml"
    versionKey: "$.dependencies[1].version"
    repository: https://kyverno.github.io/policy-reporter
