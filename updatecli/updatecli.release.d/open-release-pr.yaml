name: Update admission-controller chart version
pipelineid: "{{ .pipelineid }}"

# This updatecli pipeline receives as input a RELEASE_VERSION env var with the
# desired Kubewarden admission controller stack version.
#
# Then bumps all charts and Cargo.* files following that version and opens a PR against
# the adm-controller repo.
#
# The updatecli/updatecli.d/update-hauler-manifest.yaml policy runs after this
# one on the same branch, and copies the new versions into the Hauler manifest.

sources:
  desiredReleaseVersion:
    name: "desired release version (e.g: v1.32.0-rc2)"
    kind: shell
    spec:
      command: |
        echo '{{ requiredEnv "RELEASE_VERSION" }}'
  newestReleaseTagVersion:
    name: Extract newest tag from newest GitHub release
    # used for displaying a gh compare URL in the open PR
    # TODO continue on fail (we may not have a tag)
    kind: githubrelease
    spec:
      owner: "{{ requiredEnv .github.owner }}"
      repository: "{{ .github.repo }}"
      token: "{{ requiredEnv .github.token }}"
      key: "tagname"
      typefilter:
        draft: false
        kind: latest

  controllerChartVersion:
    name: "Compute new admission-controller Helm chart version"
    kind: shell
    spec:
      command: go run ./hack/release-chart-version '{{ requiredEnv "RELEASE_VERSION" }}'
  readmeFile:
    kind: file
    spec:
      file: "./README.md"

targets:
  update_admission_controller_helm_version:
    scmid: default
    name: Update Helm chart admission-controller version
    kind: yaml
    sourceid: controllerChartVersion
    spec:
      file: charts/admission-controller/Chart.yaml
      key: $.version
  update_admission_controller_helm_appversion:
    scmid: default
    name: Update Helm chart admission-controller appVersion
    kind: yaml
    sourceid: desiredReleaseVersion
    spec:
      file: charts/admission-controller/Chart.yaml
      key: $.appVersion
  update_controller_image_tag:
    scmid: default
    name: Update Helm chart admission-controller image tag
    kind: yaml
    sourceid: desiredReleaseVersion
    spec:
      file: charts/admission-controller/values.yaml
      key: $.image.tag
  update_audit_scanner_image_tag:
    scmid: default
    name: Update Helm chart audit-scanner version
    kind: yaml
    sourceid: desiredReleaseVersion
    spec:
      file: charts/admission-controller/values.yaml
      key: $.auditScanner.image.tag
  update_policy_server_image_tag:
    scmid: default
    name: Update Helm chart policy-server version
    kind: yaml
    sourceid: desiredReleaseVersion
    spec:
      file: charts/admission-controller/values.yaml
      key: $.policyServer.image.tag
  update_policy_server_image_tag_question:
    scmid: default
    name: Update policyServer.image.tag default in Helm chart questions.yaml
    kind: file
    sourceid: desiredReleaseVersion
    spec:
      file: charts/admission-controller/questions.yaml
      # The yaml kind cannot select a list item by the value of a field.
      matchpattern: '(variable: "policyServer\.image\.tag"\n(?:\s+[a-z_]+: .*\n)*?\s+default: )"[^"]*"'
      replacepattern: '${1}"{{ source "desiredReleaseVersion" }}"'
  update_readme:
    scmid: default
    name: Update Helm chart admission-controller README
    kind: file
    sourceid: readmeFile
    spec:
      file: charts/admission-controller/README.md
      forcecreate: true
  generate_values_schema:
    kind: shell
    disablesourceinput: true
    scmid: default
    name: Generate values.schema.json file
    spec:
      changedif:
        kind: file/checksum
        spec:
          files:
            - charts/admission-controller/values.schema.json
      command: |
        make generate-chart
  updateCargoTomlVersion:
    name: Update Cargo.toml, Cargo.lock with new version
    scmid: default
    sourceid: desiredReleaseVersion
    transformers:
      - trimprefix: "v"
    kind: shell
    spec:
      shell: /usr/bin/bash
      command: cargo set-version --package policy-server --package kwctl
      changedif:
        kind: file/checksum
        spec:
          files:
            - crates/policy-server/Cargo.toml
            - crates/kwctl/Cargo.toml
            - Cargo.lock

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.author }}"
      email: "{{ .github.email }}"
      owner: "{{ requiredEnv .github.owner }}"
      repository: "adm-controller"
      branch: "{{ .github.branch }}"
      token: "{{ requiredEnv .github.token }}"
      commitusingapi: true
      commitmessage:
        squash: true
        type: "chore"
        title: "update admission-controller Helm charts"
        hidecredit: true
        footers: "Signed-off-by: adm-controller bot <adm-controller-bot@users.noreply.github.com>"

# {{ if not .pr.haulerUpdatePr }}
actions:
  openUpdatePR:
    title: 'build: {{ source "desiredReleaseVersion" }} release'
    kind: github/pullrequest
    scmid: default
    spec:
      automerge: false
      mergemethod: squash
      description: |
        Automatic bump to `{{ source "desiredReleaseVersion" }}` release.

        Changes since last released tag: (if no tag, since HEAD^): https://github.com/{{ requiredEnv .github.owner }}/{{ .github.repo }}/compare/{{ source "newestReleaseTagVersion" | default "HEAD^" }}...updatecli_main_release_pr

        > [!IMPORTANT]
        > REMEMBER USING SQUASH MERGE FOR THIS PR
      #     {{ if .pr.reviewrs }}
      reviewers:
        #           {{ range .pr.reviewers }}
        - "{{ . }}"
      #           {{ end }}
      #     {{ end }}
      #     {{ if .pr.labels }}
      labels:
        #         {{ range .pr.labels }}
        - "{{ . }}"
      #           {{ end }}
      #     {{ end }}
      draft: false
#     {{ end }}
